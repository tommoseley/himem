<script>
const Crucible = {
  meta: { name: 'Crucible', version: '0.1', tagline: 'A design language for native apps and the web.' },
  color: {
    paper: '#F7F5F0', card: '#FFFFFF', sunk: '#EFECE5',
    hairline: 'rgba(25,20,15,0.08)', divider: 'rgba(25,20,15,0.12)',
    ink: '#1A1612', ink2: 'rgba(26,22,18,0.64)', ink3: 'rgba(26,22,18,0.42)', ink4: 'rgba(26,22,18,0.22)',
    paperD: '#0E0C0A', cardD: '#181513', sunkD: '#221E1A',
    hairlineD: 'rgba(255,245,235,0.09)', dividerD: 'rgba(255,245,235,0.14)',
    inkD: '#F5EFE6', inkD2: 'rgba(245,239,230,0.66)', inkD3: 'rgba(245,239,230,0.42)', inkD4: 'rgba(245,239,230,0.22)',
    accent: '#C64A1C', accentPressed: '#A53A13', accentTint: '#FBEAE0', accentInk: '#FFFFFF', accentOnDark: '#EC7442',
    success: '#2F7D4F', warning: '#B87322', danger: '#B8311E', info: '#1E5C8E',
    focus: 'rgba(198,74,28,0.45)',

    // Status — entry lifecycle chips (used on cards, rows, detail headers)
    status: {
      edited:    { bg: '#E6EEF8', fg: '#1E5C8E' },
      processed: { bg: '#DDEBE3', fg: '#2F7D4F' },
      confirmed: { bg: '#DDEBE3', fg: '#2F7D4F' },
      captured:  { bg: '#EFE6D4', fg: '#7A5A10' }, // Siri/Watch-origin, not yet decorated
      draft:     { bg: '#EEE9E0', fg: 'rgba(26,22,18,0.64)' },
      failed:    { bg: '#F6E1DD', fg: '#B8311E' },
      inferring: { bg: '#E6EEF8', fg: '#1E5C8E' }, // animated; see AIAction
    },

    // Media type palette — used as small dots on entry cards to honestly
    // represent which kinds of media are attached. Not separate capture
    // entry points anymore: these are badges inside the Composer.
    media: {
      audio: '#E8893A',  // ochre family
      text:  '#3FA877',  // field green
      photo: '#2E7BD6',  // signal blue
      video: '#A935B8',  // memory magenta
    },

    // AI — everything the model does wears this blue.
    // Distinct from ember (user intent) and status.info (passive informational).
    ai: { base: '#1E5C8E', strong: '#144674', tint: '#E6EEF8', ink: '#FFFFFF' },

    // Watch — OLED-first surface. Black background non-negotiable for
    // battery + edge bleed. Watch is write-only of new audio clips and a
    // read of the Pending queue; it never composes text/photo/video.
    watch: {
      paper:    '#000000',
      card:     '#1A1614',
      cardElev: '#2A2320',
      ink:      '#FFFFFF',
      ink2:     'rgba(255,255,255,0.66)',
      ink3:     'rgba(255,255,255,0.42)',
      hairline: 'rgba(255,255,255,0.10)',
      // Recording surface tokens — the level meter has its own ramp.
      recording: {
        disc:       '#C64A1C',                  // matches media.audio
        ring:       'rgba(198,74,28,0.22)',     // resting halo
        ringActive: 'rgba(198,74,28,0.55)',     // active level (pulses to mic)
      },
      pending: '#C64A1C', // matches accent/audio media
      synced:  '#3FA877', // matches success
    },

    // Topic palette — a finite pool of hues users pick from when they
    // create a Topic (workspace). Topics themselves are user data, NEVER
    // hard-coded in the system. We only define the pool.
    // Each entry is a {bg, fg} pair tuned for AA on paper + paperD.
    topicPalette: [
      // Row 1 · warms
      { key: 'ember',      bg: '#FBEAE0', fg: '#A53A13' }, // default/fallback
      { key: 'terracotta', bg: '#F4DED0', fg: '#8A4724' },
      { key: 'clay',       bg: '#EFDDD0', fg: '#7A3A1C' },
      { key: 'amber',      bg: '#F3E4C3', fg: '#8A5A0E' },
      // Row 2 · yellows & greens
      { key: 'wheat',      bg: '#EFE6CF', fg: '#7A5A10' },
      { key: 'sage',       bg: '#DFE7D9', fg: '#4A6A3A' },
      { key: 'moss',       bg: '#E0EADB', fg: '#3E6A2A' },
      { key: 'pine',       bg: '#D6E0D3', fg: '#284A1F' },
      // Row 3 · blues
      { key: 'sea',        bg: '#D6E5E3', fg: '#1F5C56' },
      { key: 'tide',       bg: '#DCE7EE', fg: '#255A7A' },
      { key: 'indigo',     bg: '#DCDFEE', fg: '#2E3E7C' },
      { key: 'violet',     bg: '#E0DAEC', fg: '#4A3577' },
      // Row 4 · purples, roses, neutrals
      { key: 'plum',       bg: '#EADDE8', fg: '#6B3567' },
      { key: 'rose',       bg: '#F1DDDD', fg: '#8A3A3A' },
      { key: 'sand',       bg: '#E6E0D6', fg: '#5A4A30' },
      { key: 'slate',      bg: '#DFE1E6', fg: '#3B4452' },
    ],
  },
  type: {
    sans: '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif',
    sansDisplay: '-apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif',
    serif: '"Source Serif 4", "Source Serif Pro", "Iowan Old Style", Georgia, serif',
    mono: 'ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace',
    display:  { size: 48, line: 54, weight: 400, letter: -0.8, family: 'serif' },
    title1:   { size: 34, line: 41, weight: 700, letter: 0.4,  family: 'sansDisplay' },
    title2:   { size: 28, line: 34, weight: 700, letter: 0.36, family: 'sansDisplay' },
    title3:   { size: 22, line: 28, weight: 600, letter: 0.35, family: 'sansDisplay' },
    headline: { size: 17, line: 22, weight: 600, letter: -0.43, family: 'sans' },
    body:     { size: 17, line: 22, weight: 400, letter: -0.43, family: 'sans' },
    callout:  { size: 16, line: 21, weight: 400, letter: -0.32, family: 'sans' },
    subhead:  { size: 15, line: 20, weight: 400, letter: -0.24, family: 'sans' },
    footnote: { size: 13, line: 18, weight: 400, letter: -0.08, family: 'sans' },
    caption1: { size: 12, line: 16, weight: 400, letter: 0,    family: 'sans' },
    caption2: { size: 11, line: 13, weight: 500, letter: 0.07, family: 'sans' },
    serif1:   { size: 56, line: 60, weight: 400, letter: -0.8, family: 'serif' },
    serif2:   { size: 40, line: 46, weight: 400, letter: -0.6, family: 'serif' },
    serif3:   { size: 28, line: 34, weight: 400, letter: -0.3, family: 'serif' },
    eyebrow:  { size: 11, line: 13, weight: 700, letter: 2.0, family: 'sans' },
  },
  space: { '0':0,'0.5':2,'1':4,'1.5':6,'2':8,'2.5':10,'3':12,'4':16,'5':20,'6':24,'7':28,'8':32,'10':40,'12':48,'14':56,'16':64,'20':80,'24':96 },
  radius: { none: 0, xs: 4, sm: 8, md: 12, lg: 16, xl: 22, pill: 9999, device: 48 },
  elevation: {
    0: 'none',
    1: '0 1px 2px rgba(40,25,15,0.06), 0 1px 3px rgba(40,25,15,0.04)',
    2: '0 2px 6px rgba(40,25,15,0.08), 0 6px 18px rgba(40,25,15,0.06)',
    3: '0 6px 16px rgba(40,25,15,0.10), 0 16px 48px rgba(40,25,15,0.10)',
    4: '0 20px 60px rgba(40,25,15,0.22), 0 4px 12px rgba(40,25,15,0.08)',
  },
  motion: {
    fast: 120, base: 200, slow: 320, pageful: 520,
    ease: {
      standard: 'cubic-bezier(0.2, 0, 0, 1)',
      emphasized: 'cubic-bezier(0.2, 0.7, 0.2, 1)',
      exit: 'cubic-bezier(0.4, 0, 1, 1)',
      spring: 'cubic-bezier(0.2, 1.3, 0.3, 1)',
    },
  },
  icon: { size: { sm: 16, md: 20, lg: 24, xl: 32 }, stroke: 1.6 },
  layout: { mobileGutter: 16, mobileMargin: 20, ipadGutter: 24, ipadMargin: 32, webGutter: 32, webMargin: 64, contentMax: 1200, readingMax: 680 },
};
function typeStyle(t, family) {
  const fam = family || t.family || 'sans';
  return {
    fontFamily: Crucible.type[fam],
    fontSize: t.size,
    lineHeight: t.line + 'px',
    fontWeight: t.weight,
    letterSpacing: t.letter + 'px',
  };
}
window.Crucible = Crucible;
window.typeStyle = typeStyle;
</script>
<script type="text/babel">
// Crucible bundle
const C = window.Crucible;
const Cc = window.Crucible;
const Cf = window.Crucible;

// ===== crucible/primitives.jsx =====
// Crucible — primitives
// Low-level building blocks: Swatch, TypeSpecimen, TokenRow, Stack, Row, Label.
// These are used by the system's own reference pages — not consumer components.

// ── Swatch ──
function Swatch({ value, name, token, size = 72, textured = false }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8, width: size + 24 }}>
      <div style={{
        width: size, height: size, borderRadius: C.radius.md,
        background: value,
        boxShadow: 'inset 0 0 0 1px ' + C.color.hairline,
        position: 'relative',
      }}/>
      <div style={{ ...typeStyle(C.type.caption2), color: C.color.ink, fontWeight: 600, textTransform: 'uppercase' }}>{name}</div>
      <div style={{ ...typeStyle(C.type.caption1), color: C.color.ink2, fontFamily: C.type.mono }}>{token}</div>
    </div>
  );
}

// ── Type specimen row ──
function TypeSpecimen({ label, token, sample = 'The quick brown fox' }) {
  const t = C.type[token];
  return (
    <div style={{ display: 'flex', alignItems: 'baseline', gap: 24, padding: '12px 0', borderBottom: '1px solid ' + C.color.hairline }}>
      <div style={{ width: 90, flexShrink: 0 }}>
        <div style={{ ...typeStyle(C.type.caption2), color: C.color.ink, fontWeight: 700, textTransform: 'uppercase' }}>{label}</div>
        <div style={{ ...typeStyle(C.type.caption1), color: C.color.ink3, fontFamily: C.type.mono }}>
          {t.size}/{t.line} · {t.weight}
        </div>
      </div>
      <div style={{ ...typeStyle(t), color: C.color.ink, flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{sample}</div>
    </div>
  );
}

// ── Token row (space, radius, etc.) ──
function TokenRow({ name, token, value, preview }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '8px 0', borderBottom: '1px solid ' + C.color.hairline }}>
      <div style={{ width: 80, ...typeStyle(C.type.caption1), fontFamily: C.type.mono, color: C.color.ink }}>{name}</div>
      <div style={{ width: 40, ...typeStyle(C.type.caption1), color: C.color.ink2, textAlign: 'right', fontVariantNumeric: 'tabular-nums' }}>{value}</div>
      <div style={{ flex: 1 }}>{preview}</div>
    </div>
  );
}

// ── Section label ──
function SectionLabel({ children }) {
  return (
    <div style={{
      ...typeStyle(C.type.eyebrow),
      color: C.color.ink3,
      textTransform: 'uppercase',
      marginBottom: 12,
    }}>{children}</div>
  );
}

// ── Editorial title (serif) ──
function EditorialTitle({ children, size = 'serif2', color }) {
  return (
    <div style={{ ...typeStyle(C.type[size]), color: color || C.color.ink }}>{children}</div>
  );
}

// ── Do / Don't card ──
function GuidanceCard({ verdict, children, caption }) {
  const isYes = verdict === 'do';
  const accent = isYes ? C.color.success : C.color.danger;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{
        position: 'relative',
        background: C.color.card,
        borderRadius: C.radius.md,
        padding: 20,
        border: '1px solid ' + C.color.hairline,
        borderTop: '3px solid ' + accent,
        minHeight: 120,
      }}>
        {children}
      </div>
      <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
        <div style={{
          ...typeStyle(C.type.caption2),
          color: accent,
          fontWeight: 700,
          textTransform: 'uppercase',
          flexShrink: 0,
          paddingTop: 2,
        }}>{isYes ? 'Do' : "Don't"}</div>
        <div style={{ ...typeStyle(C.type.footnote), color: C.color.ink2 }}>{caption}</div>
      </div>
    </div>
  );
}

Object.assign(window, { Swatch, TypeSpecimen, TokenRow, SectionLabel, EditorialTitle, GuidanceCard });


// ===== crucible/components.jsx =====
// Crucible — core components
// Button, Field, Card, Sheet, Nav, Icon. iOS-first, adapt-everywhere.


// ───────── Icon ─────────
// Minimal stroke icon set. 24×24 viewbox, 1.6 stroke, round caps.
const Icons = {
  plus:     <path d="M12 5v14M5 12h14"/>,
  check:    <path d="M5 13l4 4L19 7"/>,
  x:        <path d="M6 6l12 12M18 6L6 18"/>,
  chevronR: <path d="M9 6l6 6-6 6"/>,
  chevronL: <path d="M15 6l-6 6 6 6"/>,
  search:   <g><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></g>,
  mic:      <g><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></g>,
  camera:   <g><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></g>,
  sparkle:  <path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2zM19 15l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/>,
  calendar: <g><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></g>,
  clock:    <g><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>,
  bolt:     <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>,
  alert:    <g><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></g>,
  pencil:   <g><path d="M4 20l4-1 10-10-3-3L5 16l-1 4z"/><path d="M13 7l3 3"/></g>,
  video:    <g><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></g>,
};

function Icon({ name, size = 20, color = 'currentColor', stroke = 1.6, filled = false }) {
  const g = Icons[name];
  if (!g) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? color : 'none'}
      stroke={filled ? 'none' : color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">
      {g}
    </svg>
  );
}

// ───────── Button ─────────
// variants: primary · secondary · ghost · destructive
// sizes: sm · md · lg
// states: default · hover · pressed · loading · disabled
function Button({
  variant = 'primary', size = 'md', state = 'default',
  icon, iconOnly, children, dark = false, fullWidth,
}) {
  const SIZE = {
    sm: { h: 32, px: 12, fs: C.type.subhead, radius: Cc.radius.sm, gap: 6 },
    md: { h: 44, px: 18, fs: C.type.body, radius: Cc.radius.sm, gap: 8 },
    lg: { h: 56, px: 24, fs: C.type.headline, radius: Cc.radius.md, gap: 10 },
  }[size];

  const neutral = dark ? Cc.color.cardD : Cc.color.card;
  const ink = dark ? Cc.color.inkD : Cc.color.ink;

  const VAR = {
    primary:     { bg: Cc.color.accent,         fg: Cc.color.accentInk,       border: 'transparent' },
    secondary:   { bg: neutral,                 fg: ink,                      border: dark ? Cc.color.dividerD : Cc.color.divider },
    ghost:       { bg: 'transparent',           fg: Cc.color.accent,          border: 'transparent' },
    destructive: { bg: Cc.color.danger,         fg: '#fff',                   border: 'transparent' },
  }[variant];

  let bg = VAR.bg, fg = VAR.fg, opacity = 1, shadow = 'none';
  if (variant === 'primary') shadow = Cc.elevation[1];
  if (state === 'hover' && variant === 'primary') bg = Cc.color.accentPressed;
  if (state === 'hover' && variant === 'secondary') bg = dark ? Cc.color.sunkD : Cc.color.sunk;
  if (state === 'hover' && variant === 'ghost') bg = Cc.color.accentTint;
  if (state === 'pressed') { opacity = 0.85; shadow = 'none'; }
  if (state === 'disabled') opacity = 0.4;

  const isLoading = state === 'loading';

  return (
    <div style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      height: SIZE.h,
      padding: iconOnly ? 0 : `0 ${SIZE.px}px`,
      width: iconOnly ? SIZE.h : (fullWidth ? '100%' : undefined),
      background: bg, color: fg,
      borderRadius: SIZE.radius,
      border: '1px solid ' + VAR.border,
      gap: SIZE.gap,
      boxShadow: shadow,
      opacity,
      cursor: state === 'disabled' ? 'not-allowed' : 'pointer',
      ...typeStyle(SIZE.fs),
      fontWeight: 600,
      whiteSpace: 'nowrap',
      transition: 'background 160ms',
    }}>
      {isLoading ? (
        <div style={{
          width: 16, height: 16, borderRadius: 8,
          border: '2px solid ' + fg, borderTopColor: 'transparent',
          animation: 'crucible-spin 800ms linear infinite',
        }}/>
      ) : icon && <Icon name={icon} size={size === 'lg' ? 22 : 18} color={fg}/>}
      {!iconOnly && children}
    </div>
  );
}

// ───────── Field (text input) ─────────
function Field({
  label, value, placeholder = 'Placeholder',
  state = 'default', helper, icon, trailing,
  dark = false, size = 'md',
}) {
  const H = { sm: 36, md: 44, lg: 52 }[size];
  const bg = dark ? Cc.color.cardD : Cc.color.card;
  const ink = dark ? Cc.color.inkD : Cc.color.ink;
  const ink3 = dark ? Cc.color.inkD3 : Cc.color.ink3;
  const border = state === 'focus' ? Cc.color.accent
    : state === 'error' ? Cc.color.danger
    : (dark ? Cc.color.dividerD : Cc.color.divider);
  const ring = state === 'focus' ? `0 0 0 3px ${Cc.color.focus}` : 'none';
  const isEmpty = !value;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      {label && <div style={{ ...typeStyle(C.type.footnote), color: dark ? Cc.color.inkD2 : Cc.color.ink2, fontWeight: 500 }}>{label}</div>}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 10,
        height: H, padding: '0 14px',
        background: bg, borderRadius: Cc.radius.sm,
        border: '1px solid ' + border,
        boxShadow: ring,
        color: ink, ...typeStyle(C.type.body),
        transition: 'border 140ms, box-shadow 140ms',
      }}>
        {icon && <Icon name={icon} size={18} color={ink3}/>}
        <div style={{ flex: 1, color: isEmpty ? ink3 : ink }}>{value || placeholder}</div>
        {trailing}
        {state === 'focus' && <div style={{ width: 1.5, height: 20, background: Cc.color.accent, animation: 'crucible-caret 1s steps(2) infinite' }}/>}
      </div>
      {helper && <div style={{ ...typeStyle(C.type.caption1), color: state === 'error' ? Cc.color.danger : (dark ? Cc.color.inkD3 : Cc.color.ink3) }}>{helper}</div>}
    </div>
  );
}

// ───────── Card ─────────
function Card({ children, elevation = 1, dark = false, style = {}, padding = 20 }) {
  return (
    <div style={{
      background: dark ? Cc.color.cardD : Cc.color.card,
      borderRadius: Cc.radius.lg,
      padding,
      boxShadow: Cc.elevation[elevation],
      border: elevation === 0 ? '1px solid ' + (dark ? Cc.color.dividerD : Cc.color.divider) : 'none',
      ...style,
    }}>{children}</div>
  );
}

// ───────── Chip / Badge ─────────
function Chip({ children, tone = 'neutral', size = 'md', icon, dark = false }) {
  const H = { sm: 22, md: 26 }[size];
  const TONE = {
    neutral: { bg: dark ? Cc.color.sunkD : Cc.color.sunk, fg: dark ? Cc.color.inkD : Cc.color.ink },
    accent:  { bg: Cc.color.accentTint, fg: Cc.color.accentPressed },

  }[tone];
  return (
    <div style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      height: H, padding: '0 10px',
      background: TONE.bg, color: TONE.fg,
      borderRadius: Cc.radius.pill,
      ...typeStyle(C.type.caption2), fontWeight: 600,
      textTransform: 'uppercase', letterSpacing: 0.6,
    }}>

// ───────── Toggle / Switch ─────────
function Toggle({ on = false, dark = false }) {
  return (
    <div style={{
      width: 51, height: 31, borderRadius: 16,
      background: on ? Cc.color.accent : (dark ? Cc.color.sunkD : '#E4DFD6'),
      position: 'relative', transition: 'background 180ms',
    }}>
      <div style={{
        position: 'absolute', top: 2, left: on ? 22 : 2,
        width: 27, height: 27, borderRadius: 14, background: '#fff',
        boxShadow: '0 2px 4px rgba(0,0,0,0.15)',
        transition: 'left 200ms cubic-bezier(0.2, 1.3, 0.3, 1)',
      }}/>
    </div>
  );
}

// ───────── Segmented control ─────────
function Segmented({ items, active = 0, dark = false }) {
  const bg = dark ? Cc.color.sunkD : '#E7E2D9';
  return (
    <div style={{
      display: 'inline-flex', background: bg,
      borderRadius: 10, padding: 2, gap: 0,
    }}>
      {items.map((it, i) => (
        <div key={i} style={{
          padding: '7px 14px',
          background: i === active ? (dark ? Cc.color.cardD : Cc.color.card) : 'transparent',
          borderRadius: 8,
          color: dark ? Cc.color.inkD : Cc.color.ink,
          boxShadow: i === active ? '0 1px 2px rgba(0,0,0,0.1)' : 'none',
          ...typeStyle(C.type.subhead), fontWeight: 600,
        }}>{it}</div>
      ))}
    </div>
  );
}

// ───────── List row (iOS) ─────────
function CListRow({ title, detail, icon, trailing = 'chevron', isLast, dark = false, destructive }) {
  const ink = destructive ? Cc.color.danger : (dark ? Cc.color.inkD : Cc.color.ink);
  const ink2 = dark ? Cc.color.inkD2 : Cc.color.ink2;
  const sep = dark ? Cc.color.dividerD : Cc.color.divider;
  return (
    <div style={{ position: 'relative', display: 'flex', alignItems: 'center', gap: 12, padding: '14px 16px', minHeight: 52 }}>
      {icon && (
        <div style={{ width: 30, height: 30, borderRadius: 7, background: Cc.color.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <Icon name={icon} size={16} color="#fff"/>
        </div>
      )}
      <div style={{ flex: 1, color: ink, ...typeStyle(C.type.body) }}>{title}</div>
      {detail && <div style={{ color: ink2, ...typeStyle(C.type.body) }}>{detail}</div>}
      {trailing === 'chevron' && <Icon name="chevronR" size={14} color={dark ? Cc.color.inkD3 : Cc.color.ink3}/>}
      {trailing === 'toggle' && <Toggle on dark={dark}/>}
      {!isLast && <div style={{ position: 'absolute', bottom: 0, left: icon ? 58 : 16, right: 0, height: 1, background: sep }}/>}
    </div>
  );
}

// ───────── Sheet (bottom) ─────────
function Sheet({ title, children, dark = false, width = 390, height = 500 }) {
  return (
    <div style={{
      width, height, background: Cc.color.paper,
      borderRadius: Cc.radius.xl,
      position: 'relative', overflow: 'hidden',
      boxShadow: Cc.elevation[4],
    }}>
      <div style={{ padding: '12px 0 8px', display: 'flex', justifyContent: 'center' }}>
        <div style={{ width: 36, height: 5, borderRadius: 3, background: Cc.color.ink4 }}/>
      </div>
      {title && (
        <div style={{ padding: '4px 20px 16px' }}>
          <div style={{ ...typeStyle(C.type.title3), color: Cc.color.ink }}>{title}</div>
        </div>
      )}
      {children}
    </div>
  );
}

  const items = [

// ───────── Topic chip ─────────
// Topics = user-authored workspaces. Crucible defines the POOL of hues
// and the chip component. It does NOT define which Topics exist.
// Sample data below is illustrative only.
function ComponentTopicChip() {
  const SAMPLE = [
    { name: 'Garden',           paletteKey: 'moss',  count: 142 },
    { name: 'Content Creation', paletteKey: 'plum',  count: 38 },
    { name: 'Cooking',          paletteKey: 'clay',  count: 87 },
    { name: 'Social',           paletteKey: 'ember', count: 29 },
    { name: 'Photography',      paletteKey: 'slate', count: 64 },
    { name: 'The Combine',      paletteKey: 'tide',  count: 22 },
  ];
  const pal = Object.fromEntries(C.color.topicPalette.map(p => [p.key, p]));

  const Chip = ({ t, size = 'md', variant = 'tint', active }) => {
    const p = pal[t.paletteKey] || pal.ember;
    const sizes = {
      sm: { py: 2, px: 8,  fs: 11, gap: 5, dot: 5 },
      md: { py: 4, px: 12, fs: 13, gap: 6, dot: 6 },
      lg: { py: 6, px: 14, fs: 14, gap: 7, dot: 7 },
    }[size];
    const base = {
      display:'inline-flex', alignItems:'center', gap: sizes.gap,
      padding: `${sizes.py}px ${sizes.px}px`, borderRadius: 999,
      fontSize: sizes.fs, fontWeight: 600, fontFamily: C.type.sans,
      letterSpacing: -0.1, lineHeight: 1,
    };
    if (variant === 'tint') {
      return <span style={{ ...base, background: p.bg, color: p.fg }}>
        {t.name}
      </span>;
    }
    if (variant === 'outline') {
      return <span style={{ ...base,
        background: active ? p.bg : 'transparent',
        color: active ? p.fg : C.color.ink,
        border: '1px solid ' + (active ? p.bg : C.color.divider),
      }}>{t.name}</span>;
    }
    // dotted: neutral chip with a colored dot (useful in dense lists)
    return <span style={{ ...base, background: C.color.sunk, color: C.color.ink }}>
      <span style={{ width: sizes.dot, height: sizes.dot, borderRadius:'50%', background: p.fg }}/>
      {t.name}
    </span>;
  };

  return (
    <div style={{ padding: 40, background: C.color.paper, height: '100%', overflow: 'hidden' }}>

// ───────── Composer trigger (the FAB) ─────────
// The trigger stays ochre, bottom-right, size-stable. Tap = open Composer.
// Long-press = open Composer with audio already recording (hands-free).
// NO four-way fan-out anymore. Capture is a session, not a branching menu.
function ComponentComposerTrigger() {
  const ACCENT = C.color.accent;
  const Trigger = ({ icon = 'plus', bg = ACCENT, color = '#fff', ring }) => (
    <div style={{
      width: 56, height: 56, borderRadius: '50%', background: bg, color,
      display: 'flex', alignItems: 'center', justifyContent: 'center',

        : '0 8px 22px rgba(20,18,15,0.22), 0 1px 0 rgba(255,255,255,0.2) inset',
    }}>
      <Icon name={icon} size={22} color={color} stroke={2}/>
    </div>
  );

  const PhoneBase = ({ children, trigger }) => (
    <div style={{
      width: 230, height: 400, borderRadius: 26, position: 'relative', overflow: 'hidden',
      background: C.color.paper, border: '1px solid ' + C.color.hairline,
      boxShadow: '0 10px 32px rgba(20,18,15,0.10)',

      <div style={{ padding: '22px 14px 14px' }}>

        <div style={{ ...typeStyle(C.type.title2), color: C.color.ink, marginTop: 2 }}>Today</div>
      </div>
      {children}
      <div style={{ position:'absolute', right: 14, bottom: 14 }}>{trigger}</div>
    </div>
  );

  return (
    <div style={{ padding: 40, background: C.color.paper, height: '100%', overflow: 'hidden' }}>
      <div style={{ ...typeStyle(C.type.caption2), color: C.color.ink3, letterSpacing: 1.2, textTransform: 'uppercase' }}>Components</div>
      <div style={{ ...typeStyle(C.type.title1), color: C.color.ink, marginTop: 4 }}>Composer trigger</div>
      <div style={{ ...typeStyle(C.type.body), color: C.color.ink2, marginTop: 4, maxWidth: 720, lineHeight: 1.5 }}>
        One trigger. One gesture. No fan‑out menu. Tap opens the Composer. Long‑press opens the Composer already recording audio — the hands‑free path.
      </div>

      <div style={{ marginTop: 32, display: 'flex', gap: 28, alignItems: 'flex-start' }}>
        <div>
          <PhoneBase trigger={<Trigger icon="plus"/>}/>
          <div style={{ marginTop: 10, ...typeStyle(C.type.caption2), color: C.color.ink3, letterSpacing: 1, textTransform: 'uppercase', fontWeight: 700 }}>Rest</div>
          <div style={{ ...typeStyle(C.type.caption1), color: C.color.ink2, marginTop: 2, maxWidth: 220, lineHeight: 1.45 }}>Ochre, <code style={{ fontFamily: C.type.mono }}>+</code>, 56px. One affordance per screen.</div>
        </div>
        <div>
          <PhoneBase trigger={<Trigger icon="plus" ring/>}/>
          <div style={{ marginTop: 10, ...typeStyle(C.type.caption2), color: C.color.ink3, letterSpacing: 1, textTransform: 'uppercase', fontWeight: 700 }}>Long‑press · priming</div>
          <div style={{ ...typeStyle(C.type.caption1), color: C.color.ink2, marginTop: 2, maxWidth: 220, lineHeight: 1.45 }}>Haptic tick. Expanding ochre rings signal audio is about to open.</div>
        </div>
        <div style={{ flex: 1, minWidth: 260, maxWidth: 420 }}>
          <div style={{ ...typeStyle(C.type.caption2), color: C.color.ink3, letterSpacing: 1.2, textTransform:'uppercase', fontWeight: 700, marginBottom: 10 }}>Rules</div>
          <ul style={{ margin: 0, paddingLeft: 18, ...typeStyle(C.type.footnote), color: C.color.ink, lineHeight: 1.65 }}>
            <li><b>Size and position never change.</b> 56 × 56, 14pt inset from the safe area, bottom‑right. The trigger is the anchor — the Composer animates above it.</li>
            <li><b>No menu.</b> We used to fan out into audio / text / photo / video. We retired it: capture is a session, and those four are attachments <em>inside</em> the session, not separate destinations.</li>
            <li><b>Long‑press = audio.</b> The one gesture that earns a shortcut. Used mostly in the field, gloves on, phone almost in a pocket.</li>
            <li><b>Append mode reuses the same trigger.</b> When you tap <code style={{ fontFamily: C.type.mono }}>+</code> on an existing entry card, the Composer opens in append mode (see Patterns → Composer).</li>

          </ul>
        </div>
      </div>
    </div>
  );
}

function Accessibility() {
  const rules = [
    ['Contrast', '4.5 : 1 body · 3 : 1 headlines ≥ 18pt · 3 : 1 UI glyphs.', 'WCAG 2.2 AA, verified at each palette release.'],
    ['Hit size', 'Minimum 44 × 44 pt. Visual shape may be smaller, hit rect is not.', 'Apply to mic FAB, list chevrons, toggles.'],
    ['Focus ring', '3px ember ring at 45% alpha, offset 2px.', 'Never hide focus. Web + iPadOS keyboard.'],
    ['Motion', 'Respect prefers-reduced-motion. Cross-fade replaces spring.', 'Durations cap at 200ms when reduced.'],
    ['Text', 'All type scales with Dynamic Type. No pixel values leak into UI text.', 'xxxLarge snaps to 130%.'],
    ['Labels', 'Every icon-only control names itself via aria-label or accessibilityLabel.', 'Names use voice: "Record memory", not "Mic".'],
    ['Colorblind', 'Status is never color alone. Pair with icon + label.', 'Success = check + "Synced". Danger = alert + word.'],
    ['Selection', 'Ring indicates selection. Check indicates completion.', 'Ring = "this is the one." Check = "I did the thing."'],
    ['Surface', 'One surface per concept. Modes, not screens, for read vs. edit.', 'Entry card expands in place; Done/Cancel swap the top bar. No second "Details" screen.'],
    ['Provenance', 'Derived content never demotes its primary media.', 'Transcripts, captions, extractions are derived. Editing them is allowed; the audio / photo / video stays a first‑class attachment and source of truth.'],
    ['Peer actions', 'Destructive actions never sit beside primary actions in the same equal-weight button row.', 'On watch especially: Cancel is a corner ✕, never a peer pill. Mis-taps after a 30-second recording are unforgivable.'],
    ['Screen reader', 'Group labels follow reading order. Grouped list announces header once.', 'Decorative dividers are aria-hidden.'],
  ];
  return (
    <div style={{ padding: 48, background: C.color.paper, height: '100%', fontFamily: C.type.sans, overflow: 'hidden' }}>
      <EditorialTitle size="serif2">Accessibility</EditorialTitle>
      <div style={{ ...typeStyle(C.type.body), color: C.color.ink2, maxWidth: 560, marginTop: 12, marginBottom: 32 }}>
        Access is a baseline, not a polish pass. These rules ship with the tokens.
      </div>

      <div>
        {rules.map(([n, rule, notes]) => (
          <div key={n} style={{ display: 'grid', gridTemplateColumns: '160px 1fr 1fr', gap: 20, padding: '16px 0', borderTop: '1px solid ' + C.color.hairline }}>
            <div style={{ ...typeStyle(C.type.headline), color: C.color.ink }}>{n}</div>

            <div style={{ ...typeStyle(C.type.footnote), color: C.color.ink3 }}>{notes}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ===== crucible/design-canvas.jsx =====

// DesignCanvas.jsx — Figma-ish design canvas wrapper
// Warm gray grid bg + Sections + Artboards + PostIt notes.
// Artboards are reorderable (grip-drag), labels/titles are inline-editable,
// and any artboard can be opened in a fullscreen focus overlay (←/→/Esc).
// State persists to a .design-canvas.state.json sidecar via the host
// bridge. No assets, no deps.
//
// Usage:
//   <DesignCanvas>
//     <DCSection id="onboarding" title="Onboarding" subtitle="First-run variants">
//       <DCArtboard id="a" label="A · Dusk" width={260} height={480}>…</DCArtboard>
//       <DCArtboard id="b" label="B · Minimal" width={260} height={480}>…</DCArtboard>
//     </DCSection>
//   </DesignCanvas>

const DC = {
  bg: '#f0eee9',
  grid: 'rgba(0,0,0,0.06)',
  label: 'rgba(60,50,40,0.7)',
  title: 'rgba(40,30,20,0.85)',
  subtitle: 'rgba(60,50,40,0.6)',
  postitBg: '#fef4a8',
  postitText: '#5a4a2a',
  font: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
};

// One-time CSS injection (classes are dc-prefixed so they don't collide with
// the hosted design's own styles).
if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style');
  s.id = 'dc-styles';
  s.textContent = [
    '.dc-editable{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px;margin:0 -2px}',
    '.dc-editable:focus{background:#fff;box-shadow:0 0 0 1.5px #c96442}',
    '[data-dc-slot]{transition:transform .18s cubic-bezier(.2,.7,.3,1)}',
    '[data-dc-slot].dc-dragging{transition:none;z-index:10;pointer-events:none}',
    '[data-dc-slot].dc-dragging .dc-card{box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 2px #c96442;transform:scale(1.02)}',
    '.dc-card{transition:box-shadow .15s,transform .15s}',
    '.dc-card *{scrollbar-width:none}',
    '.dc-card *::-webkit-scrollbar{display:none}',
    '.dc-labelrow{display:flex;align-items:center;gap:4px;height:24px}',
    '.dc-grip{cursor:grab;display:flex;align-items:center;padding:5px 4px;border-radius:4px;transition:background .12s}',
    '.dc-grip:hover{background:rgba(0,0,0,.08)}',
    '.dc-grip:active{cursor:grabbing}',
    '.dc-labeltext{cursor:pointer;border-radius:4px;padding:3px 6px;display:flex;align-items:center;transition:background .12s}',
    '.dc-labeltext:hover{background:rgba(0,0,0,.05)}',
    '.dc-expand{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s,background .12s;',
    '  width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;',
    '  background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}',
    '.dc-expand:hover{background:rgba(0,0,0,.06);color:#2a251f}',
    '[data-dc-slot]:hover .dc-expand{opacity:1}',
  ].join('\n');
  document.head.appendChild(s);
}

const DCCtx = React.createContext(null);

// ─────────────────────────────────────────────────────────────
// DesignCanvas — stateful wrapper around the pan/zoom viewport.
// Owns runtime state (per-section order, renamed titles/labels, focused
// artboard). Order/titles/labels persist to a .design-canvas.state.json
// sidecar next to the HTML. Reads go via plain fetch() so the saved
// arrangement is visible anywhere the HTML + sidecar are served together
// (omelette preview, direct link, downloaded zip). Writes go through the
// host's window.omelette bridge — editing requires the omelette runtime.
// Focus is ephemeral.
// ─────────────────────────────────────────────────────────────
const DC_STATE_FILE = '.design-canvas.state.json';

function DesignCanvas({ children, minScale, maxScale, style }) {
  const [state, setState] = React.useState({ sections: {}, focus: null });
  // Hold rendering until the sidecar read settles so the saved order/titles
  // appear on first paint (no source-order flash). didRead gates writes until
  // the read settles so the empty initial state can't clobber a slow read;
  // skipNextWrite suppresses the one echo-write that would otherwise follow
  // hydration.
  const [ready, setReady] = React.useState(false);
  const didRead = React.useRef(false);
  const skipNextWrite = React.useRef(false);

  React.useEffect(() => {
    let off = false;
    fetch('./' + DC_STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((saved) => {
        if (off || !saved || !saved.sections) return;
        skipNextWrite.current = true;
        setState((s) => ({ ...s, sections: saved.sections }));
      })
      .catch(() => {})
      .finally(() => { didRead.current = true; if (!off) setReady(true); });
    const t = setTimeout(() => { if (!off) setReady(true); }, 150);
    return () => { off = true; clearTimeout(t); };
  }, []);

  React.useEffect(() => {
    if (!didRead.current) return;
    if (skipNextWrite.current) { skipNextWrite.current = false; return; }
    const t = setTimeout(() => {
      window.omelette?.writeFile(DC_STATE_FILE, JSON.stringify({ sections: state.sections })).catch(() => {});
    }, 250);
    return () => clearTimeout(t);
  }, [state.sections]);

  // Build registries synchronously from children so FocusOverlay can read
  // them in the same render. Only direct DCSection > DCArtboard children are
  // walked — wrapping them in other elements opts out of focus/reorder.
  const registry = {};     // slotId -> { sectionId, artboard }
  const sectionMeta = {};  // sectionId -> { title, subtitle, slotIds[] }
  const sectionOrder = [];
  React.Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const persisted = state.sections[sid] || {};
    const srcIds = [];
    React.Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId: sid, artboard: ab };
      srcIds.push(aid);
    });
    const kept = (persisted.order || []).filter((k) => srcIds.includes(k));
    sectionMeta[sid] = {
      title: persisted.title ?? sec.props.title,
      subtitle: sec.props.subtitle,
      slotIds: [...kept, ...srcIds.filter((k) => !kept.includes(k))],
    };
  });

  const api = React.useMemo(() => ({
    state,
    section: (id) => state.sections[id] || {},
    patchSection: (id, p) => setState((s) => ({
      ...s,
      sections: { ...s.sections, [id]: { ...s.sections[id], ...(typeof p === 'function' ? p(s.sections[id] || {}) : p) } },
    })),
    setFocus: (slotId) => setState((s) => ({ ...s, focus: slotId })),
  }), [state]);

  // Esc exits focus; any outside pointerdown commits an in-progress rename.
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') api.setFocus(null); };
    const onPd = (e) => {
      const ae = document.activeElement;
      if (ae && ae.isContentEditable && !ae.contains(e.target)) ae.blur();
    };
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onPd, true);
    return () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('pointerdown', onPd, true);
    };
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale} style={style}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>
  );
}

// ─────────────────────────────────────────────────────────────
// DCViewport — transform-based pan/zoom (internal)
//
// Input mapping (Figma-style):
//   • trackpad pinch  → zoom   (ctrlKey wheel; Safari gesture* events)
//   • trackpad scroll → pan    (two-finger)
//   • mouse wheel     → zoom   (notched; distinguished from trackpad scroll)
//   • middle-drag / primary-drag-on-bg → pan
//
// Transform state lives in a ref and is written straight to the DOM
// (translate3d + will-change) so wheel ticks don't go through React —
// keeps pans at 60fps on dense canvases.
// ─────────────────────────────────────────────────────────────
function DCViewport({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x: 0, y: 0, scale: 1 });

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    const el = worldRef.current;
    if (el) el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
  }, []);

  React.useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;

    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      // keep the world point under the cursor fixed
      t.x = px - (px - t.x) * k;
      t.y = py - (py - t.y) * k;
      t.scale = next;
      apply();
    };

    // Mouse-wheel vs trackpad-scroll heuristic. A physical wheel sends
    // line-mode deltas (Firefox) or large integer pixel deltas with no X
    // component (Chrome/Safari, typically multiples of 100/120). Trackpad
    // two-finger scroll sends small/fractional pixel deltas, often with
    // non-zero deltaX. ctrlKey is set by the browser for trackpad pinch.
    const isMouseWheel = (e) =>
      e.deltaMode !== 0 ||
      (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);

    const onWheel = (e) => {
      e.preventDefault();
      if (isGesturing) return; // Safari: gesture* owns the pinch — discard concurrent wheels
      if (e.ctrlKey) {
        // trackpad pinch (or explicit ctrl+wheel)
        zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      } else if (isMouseWheel(e)) {
        // notched mouse wheel — fixed-ratio step per click
        zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
      } else {
        // trackpad two-finger scroll — pan
        tf.current.x -= e.deltaX;
        tf.current.y -= e.deltaY;
        apply();
      }
    };

    // Safari sends native gesture* events for trackpad pinch with a smooth
    // e.scale; preferring these over the ctrl+wheel fallback gives a much
    // better feel there. No-ops on other browsers. Safari also fires
    // ctrlKey wheel events during the same pinch — isGesturing makes
    // onWheel drop those entirely so they neither zoom nor pan.
    let gsBase = 1;
    let isGesturing = false;
    const onGestureStart = (e) => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGestureChange = (e) => {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale);
    };
    const onGestureEnd = (e) => { e.preventDefault(); isGesturing = false; };

    // Drag-pan: middle button anywhere, or primary button on canvas
    // background (anything that isn't an artboard or an inline editor).
    let drag = null;
    const onPointerDown = (e) => {
      const onBg = !e.target.closest('[data-dc-slot], .dc-editable');
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault();
      vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
      vp.style.cursor = 'grabbing';
    };
    const onPointerMove = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx;
      tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY;
      apply();
    };
    const onPointerUp = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      vp.releasePointerCapture(e.pointerId);
      drag = null;
      vp.style.cursor = '';
    };

    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGestureStart, { passive: false });
    vp.addEventListener('gesturechange', onGestureChange, { passive: false });
    vp.addEventListener('gestureend', onGestureEnd, { passive: false });
    vp.addEventListener('pointerdown', onPointerDown);
    vp.addEventListener('pointermove', onPointerMove);
    vp.addEventListener('pointerup', onPointerUp);
    vp.addEventListener('pointercancel', onPointerUp);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGestureStart);
      vp.removeEventListener('gesturechange', onGestureChange);
      vp.removeEventListener('gestureend', onGestureEnd);
      vp.removeEventListener('pointerdown', onPointerDown);
      vp.removeEventListener('pointermove', onPointerMove);
      vp.removeEventListener('pointerup', onPointerUp);
      vp.removeEventListener('pointercancel', onPointerUp);
    };
  }, [apply, minScale, maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div
      ref={vpRef}
      className="design-canvas"
      style={{
        height: '100vh', width: '100vw',
        background: DC.bg,
        overflow: 'hidden',
        overscrollBehavior: 'none',
        touchAction: 'none',
        position: 'relative',
        fontFamily: DC.font,
        boxSizing: 'border-box',
        ...style,
      }}
    >
      <div
        ref={worldRef}
        style={{
          position: 'absolute', top: 0, left: 0,
          transformOrigin: '0 0',
          willChange: 'transform',
          width: 'max-content', minWidth: '100%',
          minHeight: '100%',
          padding: '60px 0 80px',
        }}
      >
        <div style={{ position: 'absolute', inset: -6000, backgroundImage: gridSvg, backgroundSize: '120px 120px', pointerEvents: 'none', zIndex: -1 }} />
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// DCSection — editable title + h-row of artboards in persisted order
// ─────────────────────────────────────────────────────────────
function DCSection({ id, title, subtitle, children, gap = 48 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const all = React.Children.toArray(children);
  const artboards = all.filter((c) => c && c.type === DCArtboard);
  const rest = all.filter((c) => !(c && c.type === DCArtboard));
  const srcOrder = artboards.map((a) => a.props.id ?? a.props.label);
  const sec = (ctx && sid && ctx.section(sid)) || {};

  const order = React.useMemo(() => {
    const kept = (sec.order || []).filter((k) => srcOrder.includes(k));
    return [...kept, ...srcOrder.filter((k) => !kept.includes(k))];
  }, [sec.order, srcOrder.join('|')]);

  const byId = Object.fromEntries(artboards.map((a) => [a.props.id ?? a.props.label, a]));

  return (
    <div data-dc-section={sid} style={{ marginBottom: 80, position: 'relative' }}>
      <div style={{ padding: '0 60px 56px' }}>
        <DCEditable tag="div" value={sec.title ?? title}
          onChange={(v) => ctx && sid && ctx.patchSection(sid, { title: v })}
          style={{ fontSize: 28, fontWeight: 600, color: DC.title, letterSpacing: -0.4, marginBottom: 6, display: 'inline-block' }} />
        {subtitle && <div style={{ fontSize: 16, color: DC.subtitle }}>{subtitle}</div>}
      </div>
      <div style={{ display: 'flex', gap, padding: '0 60px', alignItems: 'flex-start', width: 'max-content' }}>
        {order.map((k) => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} order={order}
            label={(sec.labels || {})[k] ?? byId[k].props.label}
            onRename={(v) => ctx && ctx.patchSection(sid, (x) => ({ labels: { ...x.labels, [k]: v } }))}
            onReorder={(next) => ctx && ctx.patchSection(sid, { order: next })}
            onFocus={() => ctx && ctx.setFocus(`${sid}/${k}`)} />
        ))}
      </div>
      {rest}
    </div>
  );
}

// DCArtboard — marker; rendered by DCArtboardFrame via DCSection.
function DCArtboard() { return null; }

function DCArtboardFrame({ sectionId, artboard, label, order, onRename, onReorder, onFocus }) {
  const { id: rawId, label: rawLabel, width = 260, height = 480, children, style = {} } = artboard.props;
  const id = rawId ?? rawLabel;
  const ref = React.useRef(null);

  // Live drag-reorder: dragged card sticks to cursor; siblings slide into
  // their would-be slots in real time via transforms. DOM order only
  // changes on drop.
  const onGripDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const me = ref.current;
    // translateX is applied in local (pre-scale) space but pointer deltas and
    // getBoundingClientRect().left are screen-space — divide by the viewport's
    // current scale so the dragged card tracks the cursor at any zoom level.
    const scale = me.getBoundingClientRect().width / me.offsetWidth || 1;
    const peers = Array.from(document.querySelectorAll(`[data-dc-section="${sectionId}"] [data-dc-slot]`));
    const homes = peers.map((el) => ({ el, id: el.dataset.dcSlot, x: el.getBoundingClientRect().left }));
    const slotXs = homes.map((h) => h.x);
    const startIdx = order.indexOf(id);
    const startX = e.clientX;
    let liveOrder = order.slice();
    me.classList.add('dc-dragging');

    const layout = () => {
      for (const h of homes) {
        if (h.id === id) continue;
        const slot = liveOrder.indexOf(h.id);
        h.el.style.transform = `translateX(${(slotXs[slot] - h.x) / scale}px)`;
      }
    };

    const move = (ev) => {
      const dx = ev.clientX - startX;
      me.style.transform = `translateX(${dx / scale}px)`;
      const cur = homes[startIdx].x + dx;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < slotXs.length; i++) {
        const d = Math.abs(slotXs[i] - cur);
        if (d < best) { best = d; nearest = i; }
      }
      if (liveOrder.indexOf(id) !== nearest) {
        liveOrder = order.filter((k) => k !== id);
        liveOrder.splice(nearest, 0, id);
        layout();
      }
    };

    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      const finalSlot = liveOrder.indexOf(id);
      me.classList.remove('dc-dragging');
      me.style.transform = `translateX(${(slotXs[finalSlot] - homes[startIdx].x) / scale}px)`;
      // After the settle transition, kill transitions + clear transforms +
      // commit the reorder in the same frame so there's no visual snap-back.
      setTimeout(() => {
        for (const h of homes) { h.el.style.transition = 'none'; h.el.style.transform = ''; }
        if (liveOrder.join('|') !== order.join('|')) onReorder(liveOrder);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          for (const h of homes) h.el.style.transition = '';
        }));
      }, 180);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  };

  return (
    <div ref={ref} data-dc-slot={id} style={{ position: 'relative', flexShrink: 0 }}>
      <div className="dc-labelrow" style={{ position: 'absolute', bottom: '100%', left: -4, marginBottom: 4, color: DC.label }}>
        <div className="dc-grip" onPointerDown={onGripDown} title="Drag to reorder">
          <svg width="9" height="13" viewBox="0 0 9 13" fill="currentColor"><circle cx="2" cy="2" r="1.1"/><circle cx="7" cy="2" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="2" cy="11" r="1.1"/><circle cx="7" cy="11" r="1.1"/></svg>
        </div>
        <div className="dc-labeltext" onClick={onFocus} title="Click to focus">
          <DCEditable value={label} onChange={onRename} onClick={(e) => e.stopPropagation()}
            style={{ fontSize: 15, fontWeight: 500, color: DC.label, lineHeight: 1 }} />
        </div>
      </div>
      <button className="dc-expand" onClick={onFocus} onPointerDown={(e) => e.stopPropagation()} title="Focus">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
      </button>
      <div className="dc-card"
        style={{ borderRadius: 2, boxShadow: '0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)', overflow: 'hidden', width, height, background: '#fff', ...style }}>
        {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb', fontSize: 13, fontFamily: DC.font }}>{id}</div>}
      </div>
    </div>
  );
}

// Inline rename — commits on blur or Enter.
function DCEditable({ value, onChange, style, tag = 'span', onClick }) {
  const T = tag;
  return (
    <T className="dc-editable" contentEditable suppressContentEditableWarning
      onClick={onClick}
      onPointerDown={(e) => e.stopPropagation()}
      onBlur={(e) => onChange && onChange(e.currentTarget.textContent)}
      onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}
      style={style}>{value}</T>
  );
}

// ─────────────────────────────────────────────────────────────
// Focus mode — overlay one artboard; ←/→ within section, ↑/↓ across
// sections, Esc or backdrop click to exit.
// ─────────────────────────────────────────────────────────────
function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const sec = ctx.section(sectionId);
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);

  const go = (d) => { const n = peers[(idx + d + peers.length) % peers.length]; if (n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = (d) => {
    const ns = sectionOrder[(secIdx + d + sectionOrder.length) % sectionOrder.length];
    const first = sectionMeta[ns] && sectionMeta[ns].slotIds[0];
    if (first) ctx.setFocus(`${ns}/${first}`);
  };

  React.useEffect(() => {
    const k = (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); goSection(-1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); goSection(1); }
    };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  });

  const { width = 260, height = 480, children } = artboard.props;
  const [vp, setVp] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => { const r = () => setVp({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', r); return () => window.removeEventListener('resize', r); }, []);
  const scale = Math.max(0.1, Math.min((vp.w - 200) / width, (vp.h - 260) / height, 2));

  const [ddOpen, setDd] = React.useState(false);
  const Arrow = ({ dir, onClick }) => (
    <button onClick={(e) => { e.stopPropagation(); onClick(); }}
      style={{ position: 'absolute', top: '50%', [dir]: 28, transform: 'translateY(-50%)',
        border: 'none', background: 'rgba(255,255,255,.08)', color: 'rgba(255,255,255,.9)',
        width: 44, height: 44, borderRadius: 22, fontSize: 18, cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background .15s' }}
      onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.18)')}
      onMouseLeave={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.08)')}>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <path d={dir === 'left' ? 'M11 3L5 9l6 6' : 'M7 3l6 6-6 6'} /></svg>
    </button>
  );

  // Portal to body so position:fixed is the real viewport regardless of any
  // transform on DesignCanvas's ancestors (including the canvas zoom itself).
  return ReactDOM.createPortal(
    <div onClick={() => ctx.setFocus(null)}
      onWheel={(e) => e.preventDefault()}
      style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(24,20,16,.6)', backdropFilter: 'blur(14px)',
        fontFamily: DC.font, color: '#fff' }}>

      {/* top bar: section dropdown (left) · close (right) */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 72, display: 'flex', alignItems: 'flex-start', padding: '16px 20px 0', gap: 16 }}>
        <div style={{ position: 'relative' }}>
          <button onClick={() => setDd((o) => !o)}
            style={{ border: 'none', background: 'transparent', color: '#fff', cursor: 'pointer', padding: '6px 8px',
              borderRadius: 6, textAlign: 'left', fontFamily: 'inherit' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 18, fontWeight: 600, letterSpacing: -0.3 }}>{meta.title}</span>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" style={{ opacity: .7 }}><path d="M2 4l3.5 3.5L9 4"/></svg>
            </span>
            {meta.subtitle && <span style={{ display: 'block', fontSize: 13, opacity: .6, fontWeight: 400, marginTop: 2 }}>{meta.subtitle}</span>}
          </button>
          {ddOpen && (
            <div style={{ position: 'absolute', top: '100%', left: 0, marginTop: 4, background: '#2a251f', borderRadius: 8,
              boxShadow: '0 8px 32px rgba(0,0,0,.4)', padding: 4, minWidth: 200, zIndex: 10 }}>
              {sectionOrder.map((sid) => (
                <button key={sid} onClick={() => { setDd(false); const f = sectionMeta[sid].slotIds[0]; if (f) ctx.setFocus(`${sid}/${f}`); }}
                  style={{ display: 'block', width: '100%', textAlign: 'left', border: 'none', cursor: 'pointer',
                    background: sid === sectionId ? 'rgba(255,255,255,.1)' : 'transparent', color: '#fff',
                    padding: '8px 12px', borderRadius: 5, fontSize: 14, fontWeight: sid === sectionId ? 600 : 400, fontFamily: 'inherit' }}>
                  {sectionMeta[sid].title}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{ flex: 1 }} />
        <button onClick={() => ctx.setFocus(null)}
          onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.12)')}
          onMouseLeave={(e) => (e.currentTarget.style.background = 'transparent')}
          style={{ border: 'none', background: 'transparent', color: 'rgba(255,255,255,.7)', width: 32, height: 32,
            borderRadius: 16, fontSize: 20, cursor: 'pointer', lineHeight: 1, transition: 'background .12s' }}>×</button>
      </div>

      {/* card centered, label + index below — only the card itself stops
          propagation so any backdrop click (including the margins around
          the card) exits focus */}
      <div
        style={{ position: 'absolute', top: 64, bottom: 56, left: 100, right: 100, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
        <div onClick={(e) => e.stopPropagation()} style={{ width: width * scale, height: height * scale, position: 'relative' }}>
          <div style={{ width, height, transform: `scale(${scale})`, transformOrigin: 'top left', background: '#fff', borderRadius: 2, overflow: 'hidden',
            boxShadow: '0 20px 80px rgba(0,0,0,.4)' }}>
            {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb' }}>{aid}</div>}
          </div>
        </div>
        <div onClick={(e) => e.stopPropagation()} style={{ fontSize: 14, fontWeight: 500, opacity: .85, textAlign: 'center' }}>
          {(sec.labels || {})[aid] ?? artboard.props.label}
          <span style={{ opacity: .5, marginLeft: 10, fontVariantNumeric: 'tabular-nums' }}>{idx + 1} / {peers.length}</span>
        </div>
      </div>

      <Arrow dir="left" onClick={() => go(-1)} />
      <Arrow dir="right" onClick={() => go(1)} />

      {/* dots */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 8 }}>
        {peers.map((p, i) => (
          <button key={p} onClick={() => ctx.setFocus(`${sectionId}/${p}`)}
            style={{ border: 'none', padding: 0, cursor: 'pointer', width: 6, height: 6, borderRadius: 3,
              background: i === idx ? '#fff' : 'rgba(255,255,255,.3)' }} />
        ))}
      </div>
    </div>,
    document.body,
  );
}

// ─────────────────────────────────────────────────────────────
// Post-it — absolute-positioned sticky note
// ─────────────────────────────────────────────────────────────
function DCPostIt({ children, top, left, right, bottom, rotate = -2, width = 180 }) {
  return (
    <div style={{
      position: 'absolute', top, left, right, bottom, width,
      background: DC.postitBg, padding: '14px 16px',

      transform: `rotate(${rotate}deg)`,
      zIndex: 5,
    }}>{children}</div>
  );
}

                <svg width="10" height="12" viewBox="0 0 10 12" fill="#fff"><path d="M0 0l10 6-10 6z"/></svg>
              </div>
              <div style={{ flex: 1, display: 'flex', gap: 2, alignItems: 'flex-end', height: 22 }}>
                {[4,8,14,6,10,18,12,9,15,7,11,5,10,14,8,13,6,11,9,15,7,10].map((h, i) => (
                  <div key={i} style={{ width: 2, height: h, background: C.color.accent, borderRadius: 1, opacity: i < 8 ? 1 : 0.3 }}/>
                ))}
              </div>
              <div style={{ ...typeStyle(C.type.caption1), color: C.color.ink2, fontVariantNumeric: 'tabular-nums' }}>0:04 / 0:12</div>
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <Chip tone="accent">light</Chip><Chip>home</Chip><Chip>quiet</Chip>
              <Chip><Icon name="plus" size={11}/> add</Chip>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
