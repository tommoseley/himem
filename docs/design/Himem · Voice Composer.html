<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Himem · Voice Composer · on a roll on phone</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  #root { width: 100vw; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="screens-voice-composer.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas
      title="Voice Composer · on a roll on phone"
      subtitle="Phone capture surface — direct voice + append. Mirrors the Watch canonical recording UI. Mic never pauses across Next."
    >
      <DCSection id="proposal" title="Proposal · tight cluster + live transcript (May 25 2026)" subtitle="Pulls REC + timer + waveform into one tight upper-cluster; anchors the on-a-roll state line directly below the waveform; adds a live-transcribed Source Serif italic phrase below — Crucible's audio-as-hero principle made literal. Below sit the existing layouts for comparison.">
        <DCArtboard id="tight-empty" label="Empty · 0:03 · Listening…" width={340} height={735}>
          <ScrVCTightEmpty />
        </DCArtboard>
        <DCArtboard id="tight-clip1" label="Direct · clip 1 · transcript filling" width={340} height={735}>
          <ScrVCTightClip1 />
        </DCArtboard>
        <DCArtboard id="tight-midroll" label="Direct · clip 2 · on a roll" width={340} height={735}>
          <ScrVCTightMidRoll />
        </DCArtboard>
        <DCArtboard id="tight-append" label="Append · clip 1 · header pill visible" width={340} height={735}>
          <ScrVCTightAppend />
        </DCArtboard>
      </DCSection>

      <DCSection id="breath" title="Fresh-start countdown · one breath" subtitle="One ochre ring fills clockwise in ~800ms with a 200ms tail. Italic caption inside. Caption rotates across recordings — index persisted in localStorage, advanced when the user commits to the recording (not on cancel). Sixteen captions in the rotation. Soft haptic at start, slightly stronger at the moment recording begins. Tap to cancel. Bypassed on Next-clip (mic never pauses).">
        {BREATH_CAPTIONS.map((caption, i) => (
          <DCArtboard key={i} id={`breath-${i}`} label={caption} width={340} height={735}>
            <ScrVCBreath index={i}/>
          </DCArtboard>
        ))}
      </DCSection>

      <DCSection id="direct" title="Direct voice composer" subtitle="FAB on Today → Voice. Starts a fresh Memory.">
        <DCArtboard id="d-clip1" label="1. Clip 1 · before any roll" width={340} height={735}>
          <ScrVCDirectClip1 />
        </DCArtboard>
        <DCArtboard id="d-midroll" label="2. Mid-roll · clip 2" width={340} height={735}>
          <ScrVCDirectMidRoll />
        </DCArtboard>
        <DCArtboard id="d-tap" label="3. Moment of Next tap" width={340} height={735}>
          <ScrVCMomentOfTap />
        </DCArtboard>
      </DCSection>

      <DCSection id="append" title="Append composer" subtitle="FAB inside a Memory → Voice. Clips land in the same Memory.">
        <DCArtboard id="a-clip1" label="4. Clip 1 · appending" width={340} height={735}>
          <ScrVCAppendClip1 />
        </DCArtboard>
        <DCArtboard id="a-midroll" label="5. Mid-roll · clip 2 · appending" width={340} height={735}>
          <ScrVCAppendMidRoll />
        </DCArtboard>
      </DCSection>

      <DCSection id="why" title="Why" subtitle="Capture rules must be uniform across surfaces.">
        <DCArtboard id="principle" label="Platform-uniform capture" width={680} height={520}>
          <PrincipleCard />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

function PrincipleCard() {
  const cell = { padding: '18px 22px', borderBottom: '1px solid rgba(26,22,18,0.10)' };
  const eyebrow = { fontSize: 10.5, fontWeight: 700, color: 'rgba(26,22,18,0.45)', letterSpacing: 1.6, textTransform: 'uppercase', marginBottom: 8 };
  const body = { fontSize: 14, lineHeight: 1.55, color: '#1A1612', letterSpacing: -0.1 };
  return (
    <div style={{ width: 680, height: 520, background: '#FFFCF6', overflow: 'hidden', fontFamily: '-apple-system, "SF Pro Text", system-ui, sans-serif' }}>
      <div style={{ padding: '26px 22px 8px' }}>
        <div style={{ fontFamily: '"Source Serif 4", Georgia, serif', fontSize: 26, fontWeight: 400, color: '#1A1612', letterSpacing: -0.4, lineHeight: 1.1 }}>
          One gesture. Every surface.
        </div>
        <div style={{ fontSize: 13, color: 'rgba(26,22,18,0.55)', marginTop: 6, lineHeight: 1.5 }}>
          Watch, phone direct-voice, phone append, iPad (post-MVP). Same model. Same haptic. Same words. The user shouldn't have to learn it twice.
        </div>
      </div>

      <div style={cell}>
        <div style={eyebrow}>What carries over from Watch</div>
        <div style={body}>
          Big centered timer as visual hero. Live waveform that responds to the user's voice — the
          "audio is rolling" contract is visual, not just numeric. <strong>Persistent</strong> "Clip N · on a roll"
          state line under the timer (never a 1.5s flash). Cancel as a corner ✕ glyph, never a
          peer pill to Stop. <strong>Stop & save</strong> is the only intentional commit verb.
        </div>
      </div>

      <div style={cell}>
        <div style={eyebrow}>What's different on phone</div>
        <div style={body}>
          Stop is a <strong>large circular ochre button</strong> centered at the bottom (88pt) — thumb
          ergonomics demand a bigger target than the watch pill. Next is a 56×56 satellite to the right,
          ochre-tinted at rest, ochre-filled with halo for ~250ms after tap. No per-clip 5-minute cap on
          phone. No 50-clip storage cap. Append composer adds an "Adding to · [Memory]" header pill so
          the user knows where the clips land.
        </div>
      </div>

      <div style={cell}>
        <div style={eyebrow}>Why this matters</div>
        <div style={body}>
          The watch is the fastest path from thought to capture; the phone composer is what the user
          opens when their wrist is busy and they don't want to lose a thought. If phone Next behaved
          differently — paused the mic, opened a new screen, asked "are you sure" — every user who
          learned the gesture on watch would hit a wall mid-roll. <strong>Half-applied capture rules
          are worse than uniformly-missing ones.</strong>
        </div>
      </div>

      <div style={{ padding: '18px 22px' }}>
        <div style={eyebrow}>Not on phone</div>
        <div style={body}>
          No "pause and resume." No bookmark within a single clip. No "share clip." No tier-gating —
          capture is always free, on every surface, every tier. Studio (post-MVP) brings clip-level
          editing; that's a different tier of work, not a different capture mechanic.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
