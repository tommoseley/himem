<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HiMem · Photo &amp; Video Descriptions</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  #root { width: 100vw; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="screens-photo-description.jsx"></script>

<script type="text/babel">
const AB = 340, ABH = 735;
function App() {
  return (
    <DesignCanvas
      title="Photo &amp; video descriptions"
      subtitle="A manual, per-item description for photos and videos — the human stand-in for the future visual-analysis pass. It becomes part of the memory's words: AI Organize and search read it like a voice transcript."
    >
      <DCSection id="in-context" title="1 · In the memory" subtitle="Media cards sit naturally beside voice clips. A photo with a description (filled) and a video without one (prompting empty state), in one memory.">
        <DCArtboard id="mem-media" label="Memory detail · photo + video inline" width={AB} height={1240}>
          <ScrMemoryWithMedia />
        </DCArtboard>
        <DCArtboard id="spec" label="How descriptions work" width={380} height={510}>
          <MediaDescSpecCard />
        </DCArtboard>
      </DCSection>

      <DCSection id="states" title="2 · The media card · states" subtitle="Empty invites clearly (ochre — it's a human action); filled renders the description as the card's body with a quiet Edit.">
        <DCArtboard id="card-empty" label="Photo · no description yet (prompting)" width={AB} height={300}>
          <div style={{ padding: 16, background: 'var(--paper)' }}>
            <MDMediaCard kind="photo" day="Tue" date="May 27" time="4:13 PM" location="West Garden" />
          </div>
        </DCArtboard>
        <DCArtboard id="card-filled" label="Photo · described" width={AB} height={360}>
          <div style={{ padding: 16, background: 'var(--paper)' }}>
            <MDMediaCard kind="photo" day="Tue" date="May 27" time="4:13 PM" location="West Garden"
              description="The cedar bed after the soil went in — front-left corner where the posts didn't line up. Need a second bag of compost before planting." />
          </div>
        </DCArtboard>
        <DCArtboard id="card-video" label="Video · no description yet" width={AB} height={300}>
          <div style={{ padding: 16, background: 'var(--paper)' }}>
            <MDMediaCard kind="video" duration="0:18" day="Tue" date="May 27" time="4:16 PM" location="West Garden" />
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="viewer" title="3 · The viewer" subtitle="Tap the media to open it full-frame. Read the description, or tap to edit — the photo stays first-class, the description is derived content below it (Crucible rule).">
        <DCArtboard id="viewer-read" label="Viewer · reading" width={AB} height={ABH}>
          <ScrPhotoViewer kind="photo" />
        </DCArtboard>
        <DCArtboard id="viewer-edit" label="Viewer · editing" width={AB} height={ABH}>
          <ScrPhotoViewer kind="photo" editing />
        </DCArtboard>
        <DCArtboard id="viewer-video" label="Viewer · video" width={AB} height={ABH}>
          <ScrPhotoViewer kind="video" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
