<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HiMem · Pricing &amp; Organize</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="pricing-screens.jsx"></script>
<script type="text/babel" src="pricing-screens-lifecycle.jsx"></script>
<script type="text/babel" src="pricing-screens-upgrade.jsx"></script>

<script type="text/babel">
const AB = 340, ABH = 735;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="pricing" title="1 · The pricing page"
        subtitle="Capture · Connect · Create. A1 story structure — the privacy/offline inversion leads, A3's magic-moment tile proves Connect's value inline. Studio shown as 'coming later'. $6.99/mo opening point.">
        <DCArtboard id="pricing-page" label="Upgrade · the pricing page" width={AB} height={ABH}>
          <ScrPricing />
        </DCArtboard>
      </DCSection>

      <DCSection id="lifecycle" title="2 · Memory-Detail · the organize lifecycle"
        subtitle="Capture → Draft → Accept, and Reorganize as often as you like (local on Free, frontier on Plus — never metered). The chip tracks REVIEW STATE, not tier. Reorganize rethinks Title + Summary only (never Topics/Mentions), replaces the draft (never branches), and always shows review: both new values are shown before/after and must be approved to apply — default keeps the current value.">


        <DCArtboard id="life-1" label="1 · Unorganized (Free · Organize button)" width={AB} height={ABH}>
          <ScrLifeUnorganized />
        </DCArtboard>
        <DCArtboard id="life-2" label="2 · Draft organized (unreviewed · B2 chip)" width={AB} height={ABH}>
          <ScrLifeDraft />
        </DCArtboard>
        <DCArtboard id="life-2s" label="2s · Review sheet (B1 copy)" width={AB} height={ABH}>
          <ScrLifeReviewSheet />
        </DCArtboard>
        <DCArtboard id="life-3" label="3 · Organized (reviewed · Reorganize entry)" width={AB} height={ABH}>
          <ScrLifeOrganized />
        </DCArtboard>
        <DCArtboard id="life-3r" label="3r · Reorganize review (Title + Summary · approve each)" width={AB} height={ABH}>
          <ScrLifeReorganizeSheet />
        </DCArtboard>
        <DCArtboard id="life-3st" label="3s · Organized + stale (Refresh)" width={AB} height={ABH}>
          <ScrLifeStale />
        </DCArtboard>
      </DCSection>

      <DCSection id="upgrade" title="3 · The upgrade moment"
        subtitle="An offer, never a wall. C1 fires once-ever right after the user keeps their first draft (capability framing, never 'less private'). C3 lives permanently in Settings. C2 (the 'organized 12 by hand' counter) was rejected as surveillant — not built.">
        <DCArtboard id="up-c1" label="C1 · After a glance (once-ever)" width={AB} height={ABH}>
          <ScrUpgradeC1 />
        </DCArtboard>
        <DCArtboard id="up-c3" label="C3 · Settings (always present)" width={AB} height={ABH}>
          <ScrUpgradeC3 />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
