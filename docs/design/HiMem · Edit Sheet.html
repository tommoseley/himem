<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HiMem · Unified Edit Sheet</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  #root { width: 100vw; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="screens-photo-description.jsx"></script>
<script type="text/babel" src="screens-edit-sheet.jsx"></script>

<script type="text/babel">
const AB = 340, ABH = 735;
function App() {
  return (
    <DesignCanvas
      title="One edit sheet, two media"
      subtitle="The description editor and the transcript editor do the same job — edit the words attached to a media item. They now share one template: same sheet, same Cancel·title·Done bar, same focused field, same footer slot. Only the hero (photo vs audio player) and the footer line differ, because those are content."
    >
      <DCSection id="unified" title="1 · The unified editor" subtitle="Side by side — obvious siblings now. Identical chrome; the media hero and footer are the only content-driven differences.">
        <DCArtboard id="edit-photo" label="Edit · photo description" width={AB} height={ABH}>
          <ScrEditDescription />
        </DCArtboard>
        <DCArtboard id="edit-voice" label="Edit · voice transcript" width={AB} height={ABH}>
          <ScrEditTranscript />
        </DCArtboard>
        <DCArtboard id="spec" label="One edit sheet, two media" width={380} height={420}>
          <div style={{ padding: 16 }}><EditSheetSpecCard /></div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
