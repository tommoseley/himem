<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HiMem · Captured Clips · session-first</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  #root { width: 100vw; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="screens-captured-clips-sessions.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas
      title="Captured Clips · session-first"
      subtitle="Operational surface. The unit is the session, not the clip. Throughput-optimized for users on a roll."
    >
      <DCSection id="primary" title="Session-first · v2" subtitle="One surface. Cards expand in place — no drill-in screens. May 19 2026.">
        <DCArtboard id="list" label="1. Session list (default)" width={340} height={735}>
          <ScrCCSessionList />
        </DCArtboard>
        <DCArtboard id="expanded" label="2. Card expanded (in place)" width={340} height={735}>
          <ScrCCSessionListExpanded />
        </DCArtboard>
        <DCArtboard id="sheet" label="3. Create one memory · confirm sheet" width={340} height={735}>
          <ScrCCBundleConfirm />
        </DCArtboard>
      </DCSection>

      <DCSection id="density" title="Density · pill vs tap-the-card vs compact" subtitle="Dogfood June 30: the per-card ochre pill is over half the card, squeezing the transcript — the actual memory — on a surface whose whole job is 'read this, decide.' B removes the pill (whole card taps, ochre returns once on Create in the sheet). C goes further: a left time-box replaces the date/time text, preview clamps to two lines, and a gesture (swipe/tap) expands the row. All show idle-gap sessioning — the five 6:09–6:18 dinner clips collapse into one session.">
        <DCArtboard id="list-current" label="A. Current · per-card pill (wall of ochre)" width={340} height={735}>
          <ScrCCSessionList />
        </DCArtboard>
        <DCArtboard id="list-quiet" label="B. Quiet · tap-the-card (real CIA dinner)" width={340} height={735}>
          <ScrCCQuietDinner />
        </DCArtboard>
        <DCArtboard id="list-compact" label="C. Compact · time-box + gesture-to-expand" width={340} height={735}>
          <ScrCCCompactDinner />
        </DCArtboard>
      </DCSection>

      <DCSection id="grouping" title="Captured Clips · the workbench (canonical, locked July 4 2026)" subtitle="LOCKED. Captured Clips is a workbench, not a queue: clips sit until placed, placement drains the bench, no nag-to-zero. Sort is the bench's resting state — the AI proposes confident groupings (Honest-Label: time+place & word-match on-device/Free; semantic on Plus) at the top, loose clips wait below in plain sight. Sort is the moment: pre-accepted proposals, quiet per-card Adjust/Not-together, ONE ochre commit. Select mode restores multi-select for hand-grouping non-contiguous clips — superseding v2's 'no multi-select' rule.">
        <DCArtboard id="sort" label="The bench · Sort suggestions on top, loose clips below (canonical)" width={340} height={735}>
          <ScrCCSort />
        </DCArtboard>
        <DCArtboard id="select-mode" label="Select · hand-pick non-contiguous clips → one memory" width={340} height={735}>
          <ScrCCSelectMode />
        </DCArtboard>
      </DCSection>

      <DCSection id="sync" title="Sync · incoming" subtitle="The operational truth the surface used to hide: clips don't teleport in. Two phases — download (determinate) then transcribe (indeterminate). The wait the user feels is mostly transcribe; naming the phase is what kills the frustration. May 29 2026.">
        <DCArtboard id="syncing" label="1. Receiving · download in progress" width={340} height={735}>
          <ScrCCSyncing />
        </DCArtboard>
        <DCArtboard id="transcribing" label="2. Transcribing · phase handoff" width={340} height={735}>
          <ScrCCTranscribing />
        </DCArtboard>
        <DCArtboard id="stalled" label="3. Stalled · Watch out of range" width={340} height={735}>
          <ScrCCStalled />
        </DCArtboard>
      </DCSection>

      <DCSection id="rules" title="Why" subtitle="The principle this enforces.">
        <DCArtboard id="principle" label="Operational vs reflective · v2" width={680} height={560}>
          <PrincipleCard />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

function PrincipleCard() {
  const cell = { padding: '18px 22px', borderBottom: '1px solid rgba(26,22,18,0.10)' };
  const eyebrow = { fontSize: 10.5, fontWeight: 700, color: 'rgba(26,22,18,0.45)', letterSpacing: 1.6, textTransform: 'uppercase', marginBottom: 8 };
  const body = { fontSize: 14, lineHeight: 1.55, color: '#1A1612', letterSpacing: -0.1 };
  return (
    <div style={{ width: 680, height: 560, background: '#FFFCF6', overflow: 'hidden', fontFamily: '-apple-system, "SF Pro Text", system-ui, sans-serif' }}>
      <div style={{ padding: '26px 22px 8px' }}>
        <div style={{ fontFamily: '"Source Serif 4", Georgia, serif', fontSize: 26, fontWeight: 400, color: '#1A1612', letterSpacing: -0.4, lineHeight: 1.1 }}>
          One surface. One verb. The session is the unit.
        </div>
        <div style={{ fontSize: 13, color: 'rgba(26,22,18,0.55)', marginTop: 6, lineHeight: 1.5 }}>
          v2 of the spec. The session-detail screen and the clip-list screen are deleted. Cards expand in place.
        </div>
      </div>

      <div style={cell}>
        <div style={eyebrow}>Reflective</div>
        <div style={body}>
          Memory Box, Memory detail, Projects, Today. Source Serif display. Cream paper.
          Generous whitespace. Audio-as-hero. "The first true thing on the page." These are
          rooms the user lives in.
        </div>
      </div>

      <div style={cell}>
        <div style={eyebrow}>Operational</div>
        <div style={body}>
          Captured Clips, sync state, error recovery, append flows. Throughput-optimized.
          SF Pro everywhere — no editorial type. Denser grids. Status more prominent than chrome.
          These are workflows the user moves through, not rooms they live in.
        </div>
      </div>

      <div style={cell}>
        <div style={eyebrow}>The unit rule</div>
        <div style={body}>
          On operational surfaces, the unit is <strong>whatever the user is moving through the
          system</strong>. For Captured Clips that's the <em>session</em>, not the clip. Sessions
          are what become Memories; clips are sub-components. Making sessions primary collapses
          9 clips into 3 cards and lets the default action — <strong>Create one memory</strong> — be visible
          inside every card. One tap, normally. Clip-level triage lives <em>inside the card</em>,
          revealed by tapping the body. Never a new screen.
        </div>
      </div>

      <div style={cell}>
        <div style={eyebrow}>What v2 deleted</div>
        <div style={body}>
          The session-detail page. The clip-list page. The bottom action bar with "N selected."
          The "Bundle as memory" verb. The amber accidental-warning chip. The instructional helper
          line ("Tap to select. Swipe to delete."). The selection check-glyph. The centered
          eyebrow strip. Two dismiss controls in the chrome. The floating ochre pill at the
          bottom of the screen. All of these came back across successive builds and have to stay
          out.
        </div>
      </div>

      <div style={{ padding: '18px 22px' }}>
        <div style={eyebrow}>What stays the same</div>
        <div style={body}>
          The instant a session becomes a Memory, voice switches back to reflective:
          Source Serif title in AI blue, cream paper, audio-first contracts. The seam is the
          confirm sheet itself — operational on top, reflective on the bottom. The user crosses
          it in one tap.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
