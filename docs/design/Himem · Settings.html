<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HiMem · Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="screens-projects.jsx"></script>
<script type="text/babel" src="screens-settings.jsx"></script>

<script type="text/babel">
const AB = 360;

function App() {
  return (
    <DesignCanvas
      title="HiMem · Settings"
      subtitle="The Settings sheet, brought to Crucible standard. Common settings at top → Debug (dev-only) at the bottom. Conformance fixes vs. the shipped build are flagged in the notes.">
      <DCSection id="menu" title="Settings · the menu" subtitle="One sheet. Common settings first, the dev-only Debug + Plus-override at the very bottom. Toggles are ochre (not iOS green — green is semantic-only). The shipped 'Also save captures to Photos library' toggle is omitted — it contradicts the locked data-custody decision (media lives in HiMem's iCloud Files container, never the Photos library).">
        <DCArtboard id="settings-menu" label="Settings · full menu (scrolls)" width={AB} height={2860}>
          <ScrSettingsMenu />
        </DCArtboard>
      </DCSection>

      <DCSection id="detail" title="Detail screens" subtitle="Pushed/presented from the menu rows.">
        <DCArtboard id="tutorials" label="Tutorials · hub (from the ? toolbar)" width={AB} height={720}>
          <ScrTutorialsHub />
        </DCArtboard>
        <DCArtboard id="toolbar-help" label="Toolbar · the ? entry point" width={600} height={260}>
          <ToolbarHelpDemo />
        </DCArtboard>
        <DCArtboard id="appearance" label="Appearance · theme picker" width={AB} height={600}>
          <ScrSettingsAppearance />
        </DCArtboard>
        <DCArtboard id="edit-topic" label="Edit Topic · sheet (tap a topic row)" width={AB} height={720}>
          <ScrSettingsEditTopic />
        </DCArtboard>
        <DCArtboard id="captured-empty" label="Captured Clips · empty state" width={AB} height={600}>
          <ScrCapturedClipsEmpty />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
