<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HiMem · Memory Detail · changes</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  #root { width: 100vw; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="screens-memory-detail.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas
      title="Memory Detail · two changes"
      subtitle="Date + location on every clip header. Mentions promoted out of the bottom expander, sitting between clips and the Organized · review card."
    >
      <DCSection id="page" title="Full page" subtitle="Top-to-bottom view of the updated Memory detail.">
        <DCArtboard id="md-full" label="Memory detail · with changes" width={340} height={1460}>
          <ScrMemoryDetailFull />
        </DCArtboard>
      </DCSection>

      <DCSection id="editmodel" title="Unified editing model" subtitle="One rule per category. All text (title · summary · transcript) = tap to edit in place — no pen, no edit mode. Media = tap to consume; audio is demoted to a quiet 'Original recording' control because the transcript is the working object. Removable rows = trailing red Trash swipe; delete the whole memory = toolbar Trash. Topics = tap chip → management sheet; Mentions = lightweight inline.">
        <DCArtboard id="edit-rest" label="Rest · tap anything to edit" width={340} height={1240}>
          <ScrMemoryUnifiedRest />
        </DCArtboard>
        <DCArtboard id="edit-active" label="Editing a transcript · Cancel / Done below the field" width={340} height={1240}>
          <ScrMemoryUnifiedEditing />
        </DCArtboard>
        <DCArtboard id="mention-edit" label="Mention · managed-chip edit state" width={340} height={380}>
          <ScrMentionEditState />
        </DCArtboard>
      </DCSection>

      <DCSection id="relocate" title="Moving clips between memories" subtitle="A clip always lives somewhere — inside a memory or loose on the Captured Clips bench — so one 'Move to…' primitive covers both 'move to another memory' and 'remove from this memory' (= move to the bench, clip survives). Parallel to Projects' Delete vs Remove-from-project. Entered from the clip's edit state, beside Delete clip. Moving the last clip out offers to delete the now-empty memory (decision a).">
        <DCArtboard id="clip-move-sheet" label="Where does this belong? · memory · new · or back to the bench" width={340} height={735}>
          <ScrClipMoveSheet />
        </DCArtboard>
        <DCArtboard id="clip-empty-after-move" label="Last clip moved out · offer to delete empty memory" width={340} height={735}>
          <ScrClipEmptyAfterMove />
        </DCArtboard>
      </DCSection>

      <DCSection id="diff" title="Changes" subtitle="Exactly what moved.">
        <DCArtboard id="changes" label="What changed" width={520} height={360}>
          <MDChangesCard />
        </DCArtboard>
      </DCSection>

      <DCSection id="longmem" title="Long memory · Full ⇄ Compact" subtitle="Rule: any memory with >1 clip shows the Full/Compact toggle (no magic). Size picks only the default — larger memories (>6 clips or >1,500 words) OPEN compressed in the Compact index; smaller multi-clip memories open Full. Each Compact row is a single-open expander and still a clip (same Trash/Edit swipe). This lecture (14 clips) opens Compact.">
        <DCArtboard id="lecture-compact" label="Compact · default for large memories" width={340} height={1380}>
          <ScrMemoryLectureCompact />
        </DCArtboard>
        <DCArtboard id="lecture-compact-edit" label="Compact · editing a clip (in-flow, no overlap)" width={340} height={1380}>
          <ScrMemoryLectureCompactEditing />
        </DCArtboard>
        <DCArtboard id="lecture-full" label="Full · continuous read" width={340} height={3780}>
          <ScrMemoryLectureFull />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
