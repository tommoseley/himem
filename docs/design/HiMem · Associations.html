<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HiMem · Associations</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  #root { width: 100vw; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="screens-associations.jsx"></script>

<script type="text/babel">
const AB = 340, ABH = 735;
function App() {
  return (
    <DesignCanvas
      title="Associations — one model"
      subtitle="Topics, mentions, and projects are a memory's many-to-many chips. They behave identically: read chips navigate; one dashed Edit per section opens a shared manage sheet (add / remove / delete-from-library). Retires four divergent mechanisms — topic sheet, mention ✕-pill, project no-remove, and the toolbar folder-plus."
    >
      <DCSection id="read" title="1 · Read state — three identical sections" subtitle="Navigable filled pills + one dashed Edit each. No inline ✕. Dot = topic (palette colour); person glyph = mention; folder glyph = project.">
        <DCArtboard id="mem-assoc" label="Memory detail · topics · mentions · projects" width={AB} height={800}>
          <ScrMemoryAssociations />
        </DCArtboard>
        <DCArtboard id="assoc-spec" label="One model for associations" width={430} height={1080}>
          <div style={{ padding: 16 }}><AssocSpecCard /></div>
        </DCArtboard>
      </DCSection>

      <DCSection id="manage" title="2 · Manage sheet — one structure, three types" subtitle="On this memory (tap to remove) · Add a new… · From your library (tap to add). One removal idiom everywhere — so mentions are library-backed.">
        <DCArtboard id="manage-topics" label="Topics" width={AB} height={ABH}>
          <ScrManageTopicsU />
        </DCArtboard>
        <DCArtboard id="manage-mentions" label="Mentions · library-backed" width={AB} height={ABH}>
          <ScrManageMentionsU />
        </DCArtboard>
        <DCArtboard id="manage-projects" label="Projects · add or start new" width={AB} height={ABH}>
          <ScrManageProjectsU />
        </DCArtboard>
      </DCSection>

      <DCSection id="delete" title="3 · Delete from library — palette hygiene" subtitle="The library's Edit toggle reveals a red minus per chip. Deleting a vocabulary entry warns how many memories use it (mirrors clip-delete) — the memories themselves are untouched.">
        <DCArtboard id="lib-edit" label="Library Edit mode · red minus" width={AB} height={ABH}>
          <ScrManageTopicsEditing />
        </DCArtboard>
        <DCArtboard id="lib-confirm" label="Delete-from-library · impact confirm" width={AB} height={ABH}>
          <ScrDeleteFromLibraryConfirm />
        </DCArtboard>
      </DCSection>

      <DCSection id="exception" title="4 · The one exception — through a project" subtitle="Opening a memory in a project's context keeps a contextual Remove from this project shortcut at the bottom. General management still routes through the sheet.">
        <DCArtboard id="member-through" label="Member memory · Remove from this project" width={AB} height={800}>
          <ScrMemberThroughProject />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
