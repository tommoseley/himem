<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HiMem · Onboarding</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  #root { width: 100vw; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="screens-onboarding-wizard.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas
      title="HiMem · Onboarding — permission wizard"
      subtitle="One page per permission. Replaces the old 4-screen flow. The pacing covers CloudKit's ~17–20s first-run warm-up — by the time the user finishes, the bin is ready."
    >
      <DCSection id="flow" title="The flow" subtitle="iPhone · Crucible · 7 steps, exact order: Apple → Mic → Speech → Photos → Camera → Location → Notifications, then Land.">
        <DCArtboard id="w1" label="1 · Sign in with Apple" width={340} height={735}>
          <ScrW1Apple />
        </DCArtboard>
        <DCArtboard id="w1b" label="1 · Name · pre-filled, editable" width={340} height={735}>
          <ScrW1Name />
        </DCArtboard>
        <DCArtboard id="w2" label="2 · Microphone · required" width={340} height={735}>
          <ScrW2Mic />
        </DCArtboard>
        <DCArtboard id="w3" label="3 · Speech · required" width={340} height={735}>
          <ScrW3Speech />
        </DCArtboard>
        <DCArtboard id="w4" label="4 · Photos · optional" width={340} height={735}>
          <ScrW4Photos />
        </DCArtboard>
        <DCArtboard id="w5" label="5 · Camera · optional" width={340} height={735}>
          <ScrW5Camera />
        </DCArtboard>
        <DCArtboard id="w6" label="6 · Location · optional" width={340} height={735}>
          <ScrW6Location />
        </DCArtboard>
        <DCArtboard id="w7" label="7 · Notifications · two channels" width={340} height={735}>
          <ScrW7Notifications />
        </DCArtboard>
        <DCArtboard id="wland" label="Land · into Today" width={340} height={735}>
          <ScrWLand />
        </DCArtboard>
      </DCSection>

      <DCSection id="reinstall" title="Reinstall · restore from iCloud" subtitle="Shown only when a reinstall is detected. No permission cascade — a returning user already chose. The flow is Apple auth → restore → Today; anything iOS revoked is re-requested in context at first capture. The restore is the honest version of covering the CloudKit wait.">
        <DCArtboard id="restore" label="Restoring · live count + indeterminate" width={340} height={735}>
          <ScrReinstallRestore />
        </DCArtboard>
        <DCArtboard id="restore-done" label="Caught up · auto-advance to Today" width={340} height={735}>
          <ScrReinstallRestoreDone />
        </DCArtboard>
      </DCSection>

      <DCSection id="states" title="Key states" subtitle="The moments the flow has to handle: the iOS system ask, a calm denial, and the notifications ask.">
        <DCArtboard id="s-mic-dialog" label="iOS system ask · Microphone" width={340} height={735}>
          <ScrW2MicDialog />
        </DCArtboard>
        <DCArtboard id="s-photos-denied" label="Denied · calm Settings note" width={340} height={735}>
          <ScrW4PhotosDenied />
        </DCArtboard>
        <DCArtboard id="s-notif-dialog" label="iOS system ask · Notifications" width={340} height={735}>
          <ScrW7NotificationsDialog />
        </DCArtboard>
      </DCSection>

      <DCSection id="blocked" title="Required · can't continue" subtitle="Apple, Microphone, and Speech must be granted to proceed. Apple is retryable in-app (the sheet re-shows); Mic and Speech can only be fixed in Settings, since iOS asks once. Warm wall, never a trap.">
        <DCArtboard id="b-apple" label="Blocked · Apple sign-in (retry)" width={340} height={735}>
          <ScrBlockApple />
        </DCArtboard>
        <DCArtboard id="b-mic" label="Blocked · Microphone (Settings)" width={340} height={735}>
          <ScrBlockMic />
        </DCArtboard>
        <DCArtboard id="b-speech" label="Blocked · Speech (Settings)" width={340} height={735}>
          <ScrBlockSpeech />
        </DCArtboard>
      </DCSection>

      <DCSection id="rationale" title="Notes &amp; principles" subtitle="Decision rationale, carried forward from the original onboarding and updated for the wizard.">
        <DCArtboard id="notes" label="Notes · the decisions" width={760} height={560}>
          <WizardNotes />
        </DCArtboard>
        <DCArtboard id="principles" label="Principles" width={720} height={420}>
          <WizardPrinciples />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
