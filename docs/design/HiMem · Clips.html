<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HiMem · Clips</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="screens-photo-description.jsx"></script>
<script type="text/babel" src="screens-clips-page.jsx"></script>
<script type="text/babel" src="screens-clip-model.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="clips" title="The Clips page · evidence, first-class"
        subtitle="Clips · Memories · Projects = Evidence · Context · Intent. Retires the standalone Captured Clips window. Default view leads with an AI suggestion (observation, not conclusion) then the not-yet-connected clips including the downloading-from-phone state. The All view shows 'Referenced in' on placed clips. Tapping a clip opens the clip as the primary object — the whole evidence/context ontology, legible without teaching a word.">
        <DCArtboard id="clips-default" label="Clips · default (New) · suggestion + loose + downloading" width={340} height={735}>
          <ScrClipsDefault />
        </DCArtboard>
        <DCArtboard id="clips-all" label="Clips · All · placed clips show Referenced in" width={340} height={735}>
          <ScrClipsAll />
        </DCArtboard>
        <DCArtboard id="clip-detail" label="Clip · VIEW (attached) · transcript (tap to edit) · Play · Referenced in · one Delete clip at bottom" width={340} height={735}>
          <ScrClipDetail attached={true} />
        </DCArtboard>
        <DCArtboard id="clip-detail-loose" label="Clip · VIEW (loose, in a session) · empty Referenced-in · Remove from session + Delete clip (one each)" width={340} height={735}>
          <ScrClipDetail attached={false} inSession={true} />
        </DCArtboard>
        <DCArtboard id="clip-detail-editing" label="Clip · EDIT is INLINE (same screen, tap the transcript) — field + Play + Cancel/Done · Session→Clip = 2 screens, never 3 · no fate row, no FAB" width={340} height={735}>
          <ScrClipDetail editing={true} />
        </DCArtboard>
        <DCArtboard id="media-clip-empty" label="Photo clip · Description empty → prompts (the clip's words, editable here)" width={340} height={735}>
          <ScrMediaClipDetail described={false} />
        </DCArtboard>
        <DCArtboard id="media-clip-described" label="Photo clip · Description written → reads as the clip's body, like a transcript" width={340} height={735}>
          <ScrMediaClipDetail described={true} />
        </DCArtboard>
        <DCArtboard id="clips-sessions" label="Clips · New · CALM session list — bundles of evidence, first-clip preview, tap to review (no buttons in the list)" width={340} height={735}>
          <ScrClipsSessions />
        </DCArtboard>
        <DCArtboard id="clips-mixed-session" label="Session OPENED · composition + clips + Start a Memory (primary) + Delete session (bottom) · idle-gap is media-agnostic (🎙2 · 📷1)" width={340} height={880}>
          <ScrMixedSession />
        </DCArtboard>
        <DCArtboard id="clips-after-create" label="AFTER Create · session consumed → back on the list · included clip LEFT New · excluded clip returned loose · 'Memory created · View' toast" width={340} height={735}>
          <ScrClipsAfterCreate />
        </DCArtboard>
        <DCArtboard id="clips-empty" label="Clips · New · EMPTY · source-agnostic copy (not 'from your Watch') — clips arrive from +, Watch, Siri" width={340} height={735}>
          <ScrClipsEmpty />
        </DCArtboard>
        <DCArtboard id="clips-session-excluded" label="Ring OFF = excluded (a choice, not failure) · hollow ring, legible text, no Retry · stays in card, won't join memory" width={340} height={820}>
          <ScrSessionExcluded />
        </DCArtboard>
        <DCArtboard id="clips-single-session" label="Single-clip session · same atom, ring={false}, Play kept · Start a Memory + Delete session" width={340} height={735}>
          <ScrSingleClipSession />
        </DCArtboard>
        <DCArtboard id="clips-status" label="Active Navigation Tap · tap the active Clips tab → status sheet (dot = presence, sheet = detail)" width={340} height={735}>
          <ScrClipsStatusSheet />
        </DCArtboard>
      </DCSection>
      <DCSection id="loose" title="Clips · Unconnected — the cleanup lens (All·New·Unconnected)"
        subtitle="Unconnected = connectionCount==0 (never-used ∨ previously-attached-then-deleted ∨ detached). A UNIFIED list across backing types — unpromoted inbox clips (watch/phone, source glyph on each row) AND detached MediaReferences. New = reviewed==false (unseen), so a previously-shaped clip returned by a deletion is NOT re-badged New — it reads honestly ('was in a memory · now unconnected'). Multi-select → Delete / Add to a memory (Photos-style, reuses the Sort inclusion model). No cascade at deletion, no count/badge. 'Orphaned' is architecture-only; the UI says 'Unconnected' (consistent with the status sheet's 'Not yet connected').">
        <DCArtboard id="clips-loose" label="Unconnected · resting · quiet Select (no count/badge)" width={340} height={735}>
          <ScrClipsLoose />
        </DCArtboard>
        <DCArtboard id="clips-loose-selecting" label="Unconnected · selecting · bottom bar = Add to a memory (ochre) + Delete N (danger)" width={340} height={735}>
          <ScrClipsLooseSelecting />
        </DCArtboard>
        <DCArtboard id="clips-new-selecting" label="New · selecting · session-card select (batch-selects its clips) + drag-to-select · same bottom bar" width={340} height={735}>
          <ScrClipsNewSelecting />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
