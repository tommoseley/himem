<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HiMem · Clips</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="screens-clips-page.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="clips" title="The Clips page · evidence, first-class"
        subtitle="Clips · Memories · Projects = Evidence · Context · Intent. Retires the standalone Captured Clips window. Default view leads with an AI suggestion (observation, not conclusion) then the not-yet-connected clips including the downloading-from-phone state. The All view shows 'Referenced in' on placed clips. Tapping a clip opens the clip as the primary object — the whole evidence/context ontology, legible without teaching a word.">
        <DCArtboard id="clips-default" label="Clips · default (New) · suggestion + loose + downloading" width={340} height={735}>
          <ScrClipsDefault />
        </DCArtboard>
        <DCArtboard id="clips-all" label="Clips · All · placed clips show Referenced in" width={340} height={735}>
          <ScrClipsAll />
        </DCArtboard>
        <DCArtboard id="clip-detail" label="Clip as primary object · transcript · media · Referenced in" width={340} height={735}>
          <ScrClipDetail />
        </DCArtboard>
        <DCArtboard id="clips-mixed-session" label="Mixed session · idle-gap is media-agnostic · voice + photo + voice in ONE card (3 clips)" width={340} height={880}>
          <ScrMixedSession />
        </DCArtboard>
        <DCArtboard id="clips-status" label="Active Navigation Tap · tap the active Clips tab → status sheet (dot = presence, sheet = detail)" width={340} height={735}>
          <ScrClipsStatusSheet />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
