<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HiMem · Memories</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crucible.css" />
<script src="crucible-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--sans); color: var(--ink); }
  #root { width: 100vw; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="crucible-primitives.jsx"></script>
<script type="text/babel" src="screens-projects.jsx"></script>
<script type="text/babel" src="screens-memories.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas
      title="HiMem · Memories — the list"
      subtitle="One card, no density toggle. Concise / Regular / Full retired. The card adapts to the memory via a content-fallback chain; density is contextual (list vs search vs select), never a user mode. See Memories list · spec.md."
    >
      <DCSection id="list" title="The list" subtitle="One balanced recognition card. Title in serif, everything else SF Pro. Tap → Memory Detail; there's no inline expand.">
        <DCArtboard id="memories" label="1. Memories · default" width={340} height={735}>
          <ScrMemoriesList />
        </DCArtboard>
        <DCArtboard id="filtered" label="2. Filtered · with the beginning" width={340} height={735}>
          <ScrMemoriesFiltered />
        </DCArtboard>
      </DCSection>

      <DCSection id="anatomy" title="Card anatomy &amp; the fallback chain" subtitle="The single decision that makes one card sufficient: the gist line always says something true, whatever the memory's maturity.">
        <DCArtboard id="anatomy-card" label="Card anatomy · annotated" width={760} height={560}>
          <AnatomyPanel />
        </DCArtboard>
        <DCArtboard id="fallback" label="Content-fallback chain · three states" width={760} height={520}>
          <FallbackPanel />
        </DCArtboard>
      </DCSection>

      <DCSection id="contexts" title="Density is contextual" subtitle="Same memories, different shape per context — because each context needs it, not because the user flipped a switch.">
        <DCArtboard id="search" label="Search · denser, match-highlighted" width={340} height={735}>
          <ScrSearchContext />
        </DCArtboard>
        <DCArtboard id="select" label="Project add · concise selection rows" width={340} height={735}>
          <ScrSelectContext />
        </DCArtboard>
      </DCSection>

      <DCSection id="notes" title="What changed" subtitle="Decisions locked. See Memories list · spec.md for the full writeup.">
        <DCArtboard id="rules" label="The mode decision + fixes" width={700} height={735}>
          <RulesPanel />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

// ── Annotated card anatomy ────────────────────────────────────
function AnatomyPanel() {
  const PXg = window.PX;
  const note = (n, t) => (
    <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
      <span style={{ width: 18, height: 18, borderRadius: 9, background: 'var(--accent)', color: 'var(--accent-ink)', fontSize: 10, fontWeight: 700, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: 1 }}>{n}</span>
      <span style={{ fontSize: 13, lineHeight: 1.5, color: 'var(--ink2)', letterSpacing: -0.05 }}>{t}</span>
    </div>
  );
  return (
    <div style={{ width: 760, height: 560, background: 'var(--paper)', display: 'flex', gap: 30, padding: 34, boxSizing: 'border-box', fontFamily: 'var(--sans)' }}>
      <div style={{ width: 308, flexShrink: 0 }}>
        <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 1.6, textTransform: 'uppercase', color: 'var(--ink3)', marginBottom: 12 }}>The card</div>
        <MemoryCard
          title="Content creator capture platform concept"
          time="2:22 PM" place="Marsh Walk"
          media={{ audio: 2, photo: 1 }}
          topics={['content', 'tech']}
          gist={{ kind: 'summary', text: 'A product idea for capturing creative fragments from Watch, phone, and iPad, then organizing them into longer-form work.' }}
        />
        <div style={{ marginTop: 16, fontSize: 12, color: 'var(--ink3)', lineHeight: 1.5, fontStyle: 'italic', fontFamily: 'var(--serif)' }}>
          Whole card taps to Memory Detail. No second tap target, no “Show more.”
        </div>
      </div>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 14, justifyContent: 'center' }}>
        <div style={{ fontFamily: 'var(--serif)', fontSize: 23, fontWeight: 400, letterSpacing: -0.4, color: 'var(--ink)', marginBottom: 2 }}>
          Recognition, not reading.
        </div>
        {note(1, <><strong>Title in Source Serif</strong> — the one reflective signal, the primary recognition handle.</>)}
        {note(2, <><strong>Meta</strong> — SF Pro, ink3: time · optional place.</>)}
        {note(3, <><strong>Media</strong> — glyph per type (shape, not color). Audio tints ochre; the rest warm ink. Collapses to “N items” past three types.</>)}
        {note(4, <><strong>Topics</strong> — max two chips, then a +N pill.</>)}
        {note(5, <><strong>Gist</strong> — two lines, hard clamp. Content from the fallback chain. The AI-blue sparkle is provenance and the only AI-blue on the card.</>)}
      </div>
    </div>
  );
}

// ── Fallback chain · three states ─────────────────────────────
function FallbackPanel() {
  const col = (n, label, desc, card) => (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
        <span style={{ fontFamily: 'var(--serif)', fontSize: 26, fontWeight: 400, color: 'var(--accent)', lineHeight: 1 }}>{n}</span>
        <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink)', letterSpacing: -0.1 }}>{label}</span>
      </div>
      <div style={{ fontSize: 12, color: 'var(--ink3)', lineHeight: 1.45, minHeight: 50 }}>{desc}</div>
      {card}
    </div>
  );
  return (
    <div style={{ width: 760, height: 520, background: 'var(--paper)', padding: 34, boxSizing: 'border-box', fontFamily: 'var(--sans)' }}>
      <div style={{ fontFamily: 'var(--serif)', fontSize: 23, fontWeight: 400, letterSpacing: -0.4, color: 'var(--ink)', marginBottom: 4 }}>
        The gist always says something true.
      </div>
      <div style={{ fontSize: 13, color: 'var(--ink2)', marginBottom: 22, maxWidth: 640, lineHeight: 1.5 }}>
        Resolve in order. The card adapts to how mature the memory is, instead of the user adapting the view.
      </div>
      <div style={{ display: 'flex', gap: 18 }}>
        {col('1', 'AI summary', <>Organized memory. AI-blue sparkle marks provenance. Sentence case, SF Pro.</>,
          <MemoryCard title="Content creator capture platform" time="2:22 PM" media={{ audio: 2, photo: 1 }} topics={['content', 'tech']} gist={{ kind: 'summary', text: 'A product idea for capturing creative fragments from Watch, phone, and iPad.' }} />)}
        {col('2', 'Raw excerpt', <>Unorganized. First meaningful line, in italic serif — their actual words. No sparkle.</>,
          <MemoryCard title="Untitled memory" time="11:28 AM" media={{ audio: 1 }} topics={['tech']} gist={{ kind: 'excerpt', text: 'The nice part is you can be just about anywhere and have a thought and record it…' }} />)}
        {col('3', 'Media description', <>No useful text yet. Plain ink3 description of what's there.</>,
          <MemoryCard title="Photos from the garden" time="4:13 PM" place="West Garden" media={{ photo: 3 }} topics={['garden']} gist={{ kind: 'media', text: '3 photos captured near the West Garden.' }} />)}
      </div>
    </div>
  );
}

// ── Notes ─────────────────────────────────────────────────────
function RulesPanel() {
  const cell = { padding: '18px 22px', borderBottom: '1px solid rgba(26,22,18,0.10)' };
  const eyebrow = { fontSize: 10.5, fontWeight: 700, color: 'rgba(26,22,18,0.45)', letterSpacing: 1.6, textTransform: 'uppercase', marginBottom: 8 };
  const body = { fontSize: 14, lineHeight: 1.55, color: '#1A1612', letterSpacing: -0.1 };
  const code = { fontFamily: '"SF Mono", monospace', fontSize: 12.5 };
  return (
    <div style={{ width: 700, height: 735, background: '#FFFCF6', overflow: 'hidden', fontFamily: '-apple-system, "SF Pro Text", system-ui, sans-serif' }}>
      <div style={{ padding: '26px 22px 8px' }}>
        <div style={{ fontFamily: '"Source Serif 4", Georgia, serif', fontSize: 28, fontWeight: 400, color: '#1A1612', letterSpacing: -0.4, lineHeight: 1.1 }}>
          One card. No density toggle.
        </div>
        <div style={{ fontSize: 13, color: 'rgba(26,22,18,0.55)', marginTop: 6, lineHeight: 1.5 }}>
          The list is for recognition and selection. Reading lives behind a tap.
        </div>
      </div>

      <div style={cell}>
        <div style={eyebrow}>The mode decision</div>
        <div style={body}>
          Three modes (Concise / Regular / Full) are retired. <strong>Full</strong> turned the list into the
          detail screen — a scroll swamp as memories grow; tap does it better. <strong>Concise</strong> made
          the product feel like a database. <strong>No “Show more”</strong> — expansion is a destination, not
          an inline action.
        </div>
      </div>

      <div style={cell}>
        <div style={eyebrow}>Density is contextual, not chosen</div>
        <div style={body}>
          The same memory renders denser in <strong>search</strong> (match-highlighted rows) and tighter still
          in <strong>project select</strong> (concise rows with a selection ring) — because each context needs
          it, never because the user flipped a switch. A Comfortable/Compact Settings option is a
          post-launch <em>maybe</em>, not a shipped mode.
        </div>
      </div>

      <div style={cell}>
        <div style={eyebrow}>The content-fallback chain</div>
        <div style={body}>
          The gist resolves: <strong>AI summary</strong> → <strong>raw excerpt</strong> (italic serif) →
          <strong> media description</strong>. Every card says something true regardless of how mature the
          memory is. This is what makes one card sufficient.
        </div>
      </div>

      <div style={cell}>
        <div style={eyebrow}>Load at scale (architecture)</div>
        <div style={body}>
          List index reads from the <strong>local store</strong> — instant, all 500, no CloudKit round-trip;
          the cap becomes a sync concern, not a rendering one. Heavy content (transcripts, audio, photos)
          lazy-loads from CloudKit as cards near the viewport. The list ends on a real marker:
          <em> “The beginning — your first memory, March 2024.”</em>
        </div>
      </div>

      <div style={{ padding: '18px 22px' }}>
        <div style={eyebrow}>Crucible fixes carried in</div>
        <div style={body}>
          Header chrome de-blued to warm ink. Media dots de-blued → <strong>glyph-shape</strong> differentiation
          (audio ochre, rest ink). Sticky date headers made opaque (they bled text through). Orphan date
          headers suppressed. The <code style={code}>AI SUMMARY</code> sparkle stays AI-blue — that one's correct.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
